<title>نظام إدارة بيانات المزرعة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Cairo:wght@400;500;600;700;800;900&family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --paper:#F4F4F1;
  --paper-line:#E4E4DF;
  --card:#FFFFFF;
  --ink:#151515;
  --ink-soft:#66665F;
  --barn-red:#B04538;
  --sage:#2F7044;
  --sage-dark:#2F7044;
  --accent:#C8F560;
  --accent-text:#46730B;
  --on-accent:#0E0E0F;
  --wheat:#EFEFEB;
  --wheat-bg:#EFEFEB;
  --sage-bg:#E4F0E6;
  --red-bg:#FAE8E5;
  --amber-bg:#FBF1DC;
  --raised:#EFEFEB;
  --raised-hover:#E7E7E2;
  --raised2:#E5E5E0;
  --raised3:#D6D6D0;
  --row-hover:#F7F7F4;
  --row-line:#EDEDE9;
  --focus:rgba(21,21,21,.22);
  --topbar-bg:rgba(244,244,241,.88);
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(22,39,31,.04),0 4px 14px rgba(22,39,31,.05);
  --sidebar-w:256px;
  --rail-w:76px;
  --topbar-h:68px;
  --bottom-h:64px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#0E0E0F;
  --paper-line:#2A2A2D;
  --card:#1C1C1E;
  --ink:#F2F2F2;
  --ink-soft:#8C8C8C;
  --barn-red:#D27A6F;
  --sage:#8FBF9A;
  --sage-dark:#8FBF9A;
  --accent-text:#C8F560;
  --wheat:#2A2A2D;
  --wheat-bg:#2A2A2D;
  --sage-bg:#232B25;
  --red-bg:#2E2322;
  --amber-bg:#2D281E;
  --raised:#2A2A2D;
  --raised-hover:#303034;
  --raised2:#343438;
  --raised3:#3A3A3E;
  --row-hover:#222225;
  --row-line:#242427;
  --focus:rgba(242,242,242,.25);
  --topbar-bg:rgba(14,14,15,.88);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  background-image:radial-gradient(1200px 500px at 85% -10%,#E3F2EA 0%,transparent 60%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  font-size:14px;
}
h1,h2,h3{font-family:'Cairo',sans-serif;margin:0}
button{font-family:inherit}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  position:fixed;
  inset-block:0;
  inset-inline-start:0;
  width:var(--sidebar-w);
  background:#fff;
  border-inline-end:1px solid var(--paper-line);
  display:flex;
  flex-direction:column;
  padding:14px 12px 14px;
  z-index:100;
  overflow-y:auto;
}
.brand{
  display:flex;align-items:center;gap:12px;
  background:none;border:none;cursor:pointer;text-align:start;
  padding:6px 8px 16px;margin-bottom:8px;
  border-bottom:1px solid var(--paper-line);
  color:var(--ink);
}
.brand img{width:46px;height:46px;border-radius:12px;object-fit:cover;flex-shrink:0;box-shadow:0 2px 8px rgba(23,120,75,.25)}
.brand-text{font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;line-height:1.15;min-width:0}
.brand-text small{display:block;font-weight:500;font-size:11px;color:var(--ink-soft);font-family:'Tajawal',sans-serif}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:12px;
  background:none;border:none;cursor:pointer;text-align:start;
  padding:10px 12px;border-radius:12px;
  color:#4A5C54;font-family:'Cairo',sans-serif;font-weight:600;font-size:14px;
  transition:background .12s ease,color .12s ease;
  width:100%;
}
.nav-item .lbl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nav-item .i18n-en{display:block;font-size:10px;font-weight:400;opacity:.6;margin-top:1px}
.nav-item:hover{background:#F2F7F4}
.nav-item.active{background:var(--sage-bg);color:var(--sage-dark);font-weight:700}
.nav-item.active svg.ic{stroke:var(--sage)}
.side-foot{border-top:1px solid var(--paper-line);padding-top:10px;margin-top:10px}

.main{flex:1;min-width:0;margin-inline-start:var(--sidebar-w)}
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:14px;
  min-height:var(--topbar-h);
  padding:10px 24px;
  background:rgba(243,246,244,.86);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid transparent;
}
.brand-mini{display:none}
.page-title{min-width:0;flex-shrink:0}
.page-title h1{font-size:20px;font-weight:800;line-height:1.2}
.page-title .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.search-wrap{
  flex:1;min-width:160px;max-width:520px;margin-inline-start:auto;
  display:flex;align-items:center;gap:8px;
  background:#fff;border:1px solid var(--paper-line);border-radius:999px;
  padding:0 14px;height:42px;color:var(--ink-soft);
  box-shadow:var(--shadow);
}
.search-wrap:focus-within{border-color:var(--sage);box-shadow:0 0 0 3px rgba(23,120,75,.14)}
.search-wrap input{border:none;background:transparent;outline:none !important;box-shadow:none;padding:0;height:100%;font-size:13.5px}
.quick-actions{display:flex;gap:8px;flex-shrink:0}
.wrap{padding:8px 24px 56px;max-width:1500px;margin:0 auto}

/* ---------- Cards / stats ---------- */
.card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}
.card h2{font-size:16.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2::before{content:"";width:8px;height:8px;background:var(--sage);border-radius:50%;display:inline-block;flex-shrink:0}
.card h3{font-size:14px}
.i18n-en{font-size:0.68em;font-weight:400;color:var(--ink-soft);unicode-bidi:isolate}

.tag{
  display:inline-flex;align-items:center;
  background:var(--sage-bg);color:var(--sage-dark);
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;
  padding:3px 10px;border-radius:8px;
  border:1px solid #17784B26;
}
.tag.clickable{cursor:pointer}
.tag.clickable:hover{background:var(--sage);color:#fff}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:14px;
  padding:14px 16px;
  box-shadow:var(--shadow);
}
.card .stat{box-shadow:none;background:#FAFCFB}
.stat .num{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.stat .label{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.stat.warn{background:var(--red-bg);border-color:#F3C9C4}
.stat.warn .num{color:var(--barn-red)}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  font-family:'Cairo',sans-serif;font-size:12px;text-align:start;
  color:var(--ink-soft);background:#F6F9F7;
  border-bottom:1px solid var(--paper-line);
  padding:10px 8px;white-space:nowrap;font-weight:700;
}
th:first-child{border-start-start-radius:10px}
th:last-child{border-start-end-radius:10px}
td{
  padding:10px 8px;border-bottom:1px solid #EEF2EF;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;white-space:nowrap;
}
td.text{font-family:'Tajawal',sans-serif;font-size:13px}
tr:hover td{background:#F8FBF9}
tr.sel td{background:var(--sage-bg) !important}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding-inline:4px}
tr.editing-row td{background:var(--wheat-bg)}
tr.editing-row input,tr.editing-row select{width:100%;padding:5px 7px;font-size:12px}
tr.editing-row .death-fields{display:flex;flex-direction:column;gap:4px;margin-top:4px}
tr.editing-row .death-fields input{width:100%}
.alert-row,.alert-row td{background:var(--red-bg) !important}

.backup-banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--amber-bg);border:1px solid #F3C988;border-radius:14px;
  padding:12px 16px;margin:6px 0 16px;font-size:13px;color:var(--ink);
}

.badge{
  display:inline-block;padding:3px 11px;border-radius:999px;
  font-size:11px;font-family:'Cairo',sans-serif;font-weight:700;white-space:nowrap;
}
.badge.excellent{background:var(--sage-bg);color:var(--sage-dark)}
.badge.good{background:#E3F0FB;color:#1F5C94}
.badge.weak{background:#EEF1EF;color:#5C6B64}
.badge.warn{background:var(--red-bg);color:var(--barn-red)}
.badge.neutral{background:#EEF1EF;color:var(--ink-soft)}

/* ---------- Buttons / inputs ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;
  padding:9px 18px;border-radius:12px;
  border:1px solid var(--sage);background:var(--sage);color:#fff;cursor:pointer;
  transition:background .12s ease,transform .06s ease;
  white-space:nowrap;
}
.btn:hover{background:var(--sage-dark);border-color:var(--sage-dark)}
.btn:active{transform:scale(.98)}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--paper-line)}
.btn.secondary:hover{background:#F2F7F4}
.btn.danger{background:#fff;color:var(--barn-red);border:1px solid #F0C4BF}
.btn.danger:hover{background:var(--red-bg)}
.btn.small{padding:5px 11px;font-size:11.5px;border-radius:9px}
.btn svg.ic{width:16px;height:16px}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:14px}
label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:5px;font-family:'Cairo',sans-serif;font-weight:600}
input,select,textarea{
  width:100%;padding:9px 12px;
  border:1px solid var(--paper-line);border-radius:var(--radius-sm);
  background:#fff;font-family:'Tajawal',sans-serif;font-size:14px;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid #17784B33;border-color:var(--sage)}
input[type=checkbox],input[type=radio]{width:auto}

.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:14px}
.empty .big{font-size:34px;margin-bottom:8px}

.threshold-box{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--wheat-bg);border:1px solid #17784B26;border-radius:14px;
  padding:12px 16px;margin-bottom:16px;font-size:13px;
}
.threshold-box input{width:90px;display:inline-block}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chart-label{width:110px;font-size:12px;flex-shrink:0}
.chart-bar-bg{flex:1;background:#E9EFEB;border-radius:999px;height:14px;position:relative;overflow:hidden}
.chart-bar{background:var(--sage);height:100%;border-radius:999px}
.chart-val{font-family:'IBM Plex Mono',monospace;font-size:12px;width:60px;text-align:end}

.guide-text p{line-height:1.95;margin:0 0 10px;font-size:14px}
.guide-text b{color:var(--sage-dark)}
.reset-link{font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Tajawal',sans-serif}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;
  padding:11px 22px;border-radius:999px;font-size:13px;
  font-family:'Cairo',sans-serif;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;max-width:90vw;
}
.toast.show{opacity:1}

/* ---------- Animals: filters, cards, split view ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{width:auto;min-width:130px;border-radius:999px;padding:8px 14px;font-size:13px;background:#fff}
.filters .count{margin-inline-start:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.5px;color:var(--ink-soft)}
.animal-list{display:none}
.animal-card{
  display:flex;align-items:stretch;gap:10px;
  background:#fff;border:1px solid var(--paper-line);border-radius:14px;

/* ---------- Mobile chrome (hidden on desktop) ---------- */

/* ================= Dark Bento ================= */
body{background:var(--paper);background-image:none;font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif}
*{scrollbar-color:var(--raised3) transparent}
h1,h2,h3,.brand-text,.nav-item,.btn,label,th,.badge,.tag,.chip,.tile,.bn-item,.fab,.toast,.search-wrap input,.filters select,.page-title h1{font-family:'IBM Plex Sans Arabic','Cairo',sans-serif}
td,.stat .num,.chart-val,.filters .count,.bt-hero-num{color:var(--accent-text);font-family:'IBM Plex Sans Arabic',sans-serif;font-variant-numeric:tabular-nums}
body,body *{font-weight:400 !important}
h1,h2,h3,b,strong,th,.btn,.num,.tag,.badge,.nav-item.active,.brand-text,.tile,.bn-item,.bt-hero-num,.bt-rows b,.fab,.toast,.ac-top .tag{font-weight:500 !important}
[style*="font-weight:800"],[style*="font-weight:700"],[style*="font-weight: 700"],[style*="font-weight: 800"]{font-weight:500 !important}

.sidebar{background:var(--paper);border:none}
.brand{border-bottom:none}
.brand img{box-shadow:none}
.nav-item{color:var(--ink-soft)}

.nav-item.active svg.ic{stroke:var(--ink)}
.side-foot{border-top:none}
.topbar{background:var(--topbar-bg)}
.search-wrap{background:var(--card);border:none;box-shadow:none;color:var(--ink-soft)}
.search-wrap:focus-within{box-shadow:0 0 0 2px var(--focus);border-color:transparent}
.search-wrap input{color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-soft);opacity:1}

.card{background:var(--card);border:none;box-shadow:none;border-radius:20px;padding:22px}
.card h2{font-size:15px;color:var(--ink)}
.card h2::before{display:none}
.stat{background:var(--card);border:none;box-shadow:none;border-radius:20px;padding:18px;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:8px}
.card .stat{background:var(--raised)}
.stat .num{font-size:28px;color:var(--ink)}
.stat .label{margin:0;color:var(--ink-soft)}
.stat.warn,.card .stat.warn{background:inherit}
.card .stat.warn{background:var(--raised)}
.stat.warn .num{color:var(--barn-red)}
.stat-grid{gap:10px}

th{background:transparent;color:var(--ink-soft);border-bottom:1px solid var(--raised)}
td{border-bottom:1px solid var(--row-line)}
tr:hover td{background:var(--row-hover)}
tr.sel td{background:var(--raised) !important}
tr.editing-row td{background:var(--raised)}
tr.editing-row input,tr.editing-row select{background:var(--card)}
.alert-row,.alert-row td{background:var(--red-bg) !important}
.warn{color:var(--barn-red)}

input,select,textarea{background:var(--raised);border:none;color:var(--ink);border-radius:12px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);border-color:transparent}
.btn{background:var(--raised);color:var(--ink);border:none;border-radius:12px}
.btn:hover{background:var(--raised2);border:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:#B9E852}
.btn.secondary{background:var(--raised);color:var(--ink);border:none}
.btn.secondary:hover{background:var(--raised2)}
.btn.danger{background:var(--raised);color:var(--barn-red);border:none}
.btn.danger:hover{background:var(--raised2)}

.badge.excellent{background:var(--sage-bg);color:var(--sage)}

.tag{background:var(--raised);color:var(--ink);border:none}

.chip,.chip.green,.chip.amber{background:var(--raised);color:var(--ink)}

.ic-btn{background:var(--raised);border:none;color:var(--ink-soft)}
.ic-btn.danger{color:var(--barn-red)}
.filters select{background:var(--raised);color:var(--ink)}
.backup-banner{background:var(--amber-bg);border:none;color:var(--ink)}
.threshold-box{background:var(--raised);border:none}
.chart-bar-bg{background:var(--raised)}
.chart-bar{background:var(--ink)}
.guide-text b{color:var(--ink)}
.toast{background:var(--ink);color:var(--paper)}
.sheet{background:var(--card)}
.sheet-grip{background:var(--raised3)}
.sheet-backdrop{background:rgba(0,0,0,.6)}

/* ---- bento (dashboard) ---- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.bento .stat{margin:0;justify-content:space-between}
.card .animal-card{background:var(--raised)}
.card .animal-card.sel{background:var(--raised2)}
.bento .stat .num{font-size:32px}
.bt-hero{grid-column:span 2;grid-row:span 2;background:var(--card);border-radius:20px;padding:24px;display:flex;flex-direction:column;min-height:300px}
.bt-label{font-size:13px;color:var(--ink-soft)}
.bt-hero-num{font-size:72px;line-height:1;letter-spacing:-1.5px;margin-top:16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere}
.bt-hero-num.neg{color:var(--barn-red)}
.bt-unit{font-size:15px;color:var(--ink-soft);letter-spacing:0}
.bt-rows{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.bt-rows > div{display:flex;justify-content:space-between;gap:12px}
.bt-rows .warn b{color:var(--barn-red)}
.bento .wide{grid-column:span 2}
@media (max-width:980px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bt-hero{grid-row:auto}
}
@media (max-width:480px){
  .bt-hero-num{font-size:54px}
  .bento .stat .num{font-size:26px}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter > *,.enter .bento > *{animation:rise .38s ease-out both}
.enter > *:nth-child(2),.enter .bento > *:nth-child(2){animation-delay:.04s}
.enter > *:nth-child(3),.enter .bento > *:nth-child(3){animation-delay:.08s}
.enter > *:nth-child(4),.enter .bento > *:nth-child(4){animation-delay:.12s}
.enter > *:nth-child(n+5),.enter .bento > *:nth-child(n+5){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){.enter > *,.enter .bento > *{animation:none}}

/* ================= Color palette: numbers, hover focus, buttons, icons ================= */
:root{
  --c-teal:#0E7C86; --c-green:#2F8F4E; --c-blue:#2563EB; --c-indigo:#4F46E5; --c-violet:#7C3AED;
  --c-amber:#B45309; --c-orange:#C2410C; --c-pink:#BE185D; --c-olive:#4D7C0F; --c-slate:#5B6B7F;
  --btn-bg:#0E5A63; --btn-bg-hover:#0A474E; --btn-fg:#FFFFFF;
}
html[data-theme="dark"]{
  --c-teal:#6FD0D6; --c-green:#86D39A; --c-blue:#8AB4FF; --c-indigo:#A5A0FF; --c-violet:#C4A6FF;
  --c-amber:#F3B35B; --c-orange:#FF9F6B; --c-pink:#F68BB8; --c-olive:#B5DB6A; --c-slate:#A9B6C8;
  --btn-bg:#23727A; --btn-bg-hover:#2A8790; --btn-fg:#FFFFFF;
}

/* --- numbers: color by meaning --- */
.stat{--tone:var(--c-teal)}
.stat .num{color:var(--tone)}
.stat.good{--tone:var(--c-green)}
.stat.warn,.card .stat.warn{--tone:var(--barn-red)}
.stat.warn .num{color:var(--barn-red)}
.bento > .st-total{--tone:var(--c-teal)}
.bento > .st-active{--tone:var(--c-green)}
.bento > .st-sold{--tone:var(--c-violet)}
.bento > .st-dead{--tone:var(--c-slate)}
.bento > .st-rate{--tone:var(--c-blue)}
.bento > .st-warn{--tone:var(--c-slate)}
.bento > .st-buy{--tone:var(--c-indigo)}
.bento > .st-health{--tone:var(--c-slate)}
.bento > div.stat.warn{--tone:var(--barn-red) !important}
.bento > .stat.warn,#content > .stat-grid > .stat.warn{background:var(--card)}
.bento > .st-health.warn{--tone:var(--c-amber) !important}
.bento > .st-health.warn .num{color:var(--c-amber)}
.bento .stat .label::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tone);margin-inline-end:7px;vertical-align:middle}
.bt-hero{--tone:var(--accent-text)}
.bt-rows > div:nth-child(1) b{color:var(--c-green)}
.bt-rows > div:nth-child(2) b{color:var(--c-orange)}
.bt-rows > div:nth-child(3) b{color:var(--c-pink)}
.bt-rows > div:nth-child(4) b{color:var(--c-slate)}
.bt-rows > div.warn b{color:var(--barn-red)}
.af-kv .v{color:var(--c-teal)}
.af-kv.bad .v{color:var(--barn-red)}
.sc-res-num{color:var(--c-teal)}
.sc-result.bad .sc-res-num{color:var(--barn-red)}

/* --- hover focus animation (mouse only) --- */
.stat,.bt-hero,.animal-card,.af-sec,.sc-species,.tile,.card{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,opacity .22s ease,background-color .2s ease}
@media (hover:hover) and (pointer:fine){
  .stat:hover,.bt-hero:hover,.af-sec:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 14px 30px -14px var(--tone,var(--c-teal)),0 0 0 1.5px color-mix(in srgb,var(--tone,var(--c-teal)) 45%,transparent);position:relative;z-index:2}
  .stat:hover .num,.bt-hero:hover .bt-hero-num{filter:saturate(1.25)}
  .bento:hover > *:not(:hover),.stat-grid:hover > .stat:not(:hover){opacity:.72}
  .animal-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(0,0,0,.35)}
  .sc-species:hover,.tile:hover{transform:translateY(-2px)}
}
@media (prefers-reduced-motion:reduce){
  .stat,.bt-hero,.animal-card,.af-sec,.sc-species,.tile,.card,.btn{transition:none !important}
  .stat:hover,.bt-hero:hover,.af-sec:hover,.animal-card:hover{transform:none !important}
}

/* --- buttons in palette colors --- */
.btn{background:var(--btn-bg);color:var(--btn-fg);border:none;transition:background-color .18s ease,transform .12s ease,box-shadow .18s ease}
.btn:hover{background:var(--btn-bg-hover);box-shadow:0 6px 16px -8px var(--btn-bg)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:#B9E852;box-shadow:0 6px 16px -8px #8DBA2E}
.btn.secondary{background:color-mix(in srgb,var(--h-sub) 14%,transparent);color:var(--h-main)}
.btn.secondary:hover{background:color-mix(in srgb,var(--h-sub) 24%,transparent);box-shadow:none}
.btn.danger{background:color-mix(in srgb,var(--barn-red) 13%,transparent);color:var(--barn-red)}
.btn.danger:hover{background:color-mix(in srgb,var(--barn-red) 22%,transparent);box-shadow:none}
.ic-btn{background:color-mix(in srgb,var(--h-sub) 14%,transparent);color:var(--h-main)}
.ic-btn.danger{background:color-mix(in srgb,var(--barn-red) 13%,transparent);color:var(--barn-red)}
.tgl{background:color-mix(in srgb,var(--h-sub) 14%,var(--card));color:var(--h-main)}
.tgl:hover{background:color-mix(in srgb,var(--h-sub) 26%,var(--card))}
.ds-opt.active,.sc-subtab.active{color:var(--h-main)}
.reset-link{color:var(--barn-red)}
@media (hover:hover){ .btn:hover{transform:translateY(-1px)} }

async function loadAll(){
  try{
    const a = localStorage.getItem(STORE_PREFIX+'animals');
    const w = localStorage.getItem(STORE_PREFIX+'weights');
    const s = localStorage.getItem(STORE_PREFIX+'sales');
    const ex = localStorage.getItem(STORE_PREFIX+'expenses');
    const hr = localStorage.getItem(STORE_PREFIX+'healthRecords');
    const mp = localStorage.getItem(STORE_PREFIX+'marketPrices');
    const c = localStorage.getItem(STORE_PREFIX+'config');
    const m = localStorage.getItem(STORE_PREFIX+'meta');
    if(a) state.animals = JSON.parse(a);
    if(w) state.weights = JSON.parse(w);
    if(s) state.sales = JSON.parse(s);
    if(ex) state.expenses = JSON.parse(ex);
    let migratedSubtype = false;
    state.expenses.forEach(e=>{
      if(e.subType === "أملاح معدنية"){ e.subType = "إضافات عليقة"; migratedSubtype = true; }
      // توحيد الاسم: "مركز" / "علف مركّز" / مسافات زيادة → "علف مركز" عشان يدخل صح في FCR وتكلفة العلف
      if(e.category === "علف" && typeof e.subType === 'string'){
        const t = e.subType.replace(/\s+/g,' ').trim();
        const norm = (t==="مركز" || t==="علف مركّز" || t==="علف المركز" || t==="العلف المركز") ? "علف مركز"
                   : (t==="ردّة" || t==="نخالة") ? "ردة" : t;
        if(norm !== e.subType){ e.subType = norm; migratedSubtype = true; }
      }
    });
    if(migratedSubtype) persist('expenses');
    if(hr) state.healthRecords = JSON.parse(hr);
    if(mp) state.marketPrices = JSON.parse(mp);
    try{ const ms = localStorage.getItem(STORE_PREFIX+'measurements'); if(ms) state.measurements = JSON.parse(ms) || []; }catch(e){ state.measurements = []; }
    const fs = localStorage.getItem(STORE_PREFIX+'feasibility');
    const parsedFs = fs ? JSON.parse(fs) : null;
    if(parsedFs && parsedFs.params){
      state.feasibility = parsedFs;
    } else {
      // أول مرة تفتح فيها النسخة دي، أو نسخة قديمة بشكل مختلف (بنود منفصلة من غير معادلات) — نزرع البيانات بالشكل الجديد المرتبط بالمعادلات
      state.feasibility = seedFeasibilityDefaults();
      persist('feasibility');
    }
    if(c) state.config = JSON.parse(c);
    if(m) state.meta = JSON.parse(m);
    document.getElementById('loadStatus').textContent = 'دليل مزرعتك — البيانات محفوظة تلقائيًا على هذا الجهاز';
  }catch(e){
    console.error(e);
    document.getElementById('loadStatus').textContent = 'تعذر تحميل البيانات المحفوظة سابقًا';
  }
  loaded = true;
  render();
}

async function persist(key){
  try{
    localStorage.setItem(STORE_PREFIX+key, JSON.stringify(state[key]));
  }catch(e){
    console.error(e);
    showToast('خطأ في الحفظ — تأكد إن متصفحك مسموح له يحفظ بيانات محليًا');
  }
}

// ---------- Calculations ----------
function daysBetween(d1, d2){
  const a = new Date(d1), b = new Date(d2);
  return Math.round((b - a) / 86400000);
}

// تاريخ خروج الحيوان من القطيع: تاريخ البيع للمباع، وتاريخ النفوق للنافق — بعده الحيوان مش بيدخل في أي حساب للقطيع
function animalExitDate(an){
  if(!an) return null;
  if(an.status === 'مباع'){ const sale = state.sales.find(s=>s.animalId===an.id); return (sale && sale.saleDate) || null; }
  if(an.status === 'نافق') return an.deathDate || null;
  return null;
}
function isActiveAnimal(an){ return !!an && an.status === 'نشط'; }

function computePerformance(){
  return state.animals.map(an => {
    const exitDate = animalExitDate(an);
    const ws = state.weights.filter(w => w.animalId === an.id && !(exitDate && w.date && new Date(w.date) > new Date(exitDate))).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
    const purchaseWeight = parseFloat(an.purchaseWeight);
    let alert = null, rate = null, classification = null, lastWeight = null, lastDate = null, gain = null, days = null;

    if(!purchaseWeight || purchaseWeight <= 0){
      alert = "وزن الشراء غير صحيح - راجع البيانات";
    } else if(ws.length === 0){
      alert = "بيانات غير كافية";
    } else {
      // duplicate date check
      const dateSet = {};
      let dup = false;
      ws.forEach(w => { dateSet[w.date] = (dateSet[w.date]||0)+1; if(dateSet[w.date]>1) dup = true; });
      if(dup){
        alert = "تكرار بيانات - راجع البيانات";
      } else {
        const last = ws[ws.length-1];
        lastWeight = parseFloat(last.weight);
        lastDate = last.date;
        if(new Date(lastDate) <= new Date(an.purchaseDate)){
          alert = "خطأ بالتواريخ - راجع البيانات";
        } else {
          days = daysBetween(an.purchaseDate, lastDate);
          gain = lastWeight - purchaseWeight;
          rate = gain / days;
          const th = state.config.threshold;
          if(rate <= 0) classification = "تحذير";
          else if(rate < th) classification = "ضعيف";
          else if(rate < th * 1.3) classification = "جيد";
          else classification = "ممتاز";
        }
      }
    }
    // المباع والنافق: بيفضل ظاهر بتاريخه، بس من غير تحذيرات تدخل في متابعة القطيع الحالي
    if(an.status !== 'نشط'){ alert = null; }
    return { animal: an, lastWeight, lastDate, days, gain, rate, classification, alert, exitDate };
  });
}

function computeFinancials(){
  const totalSales = state.sales.reduce((s,x)=> s+(parseFloat(x.salePrice)||0), 0);
  const totalPurchase = state.animals.reduce((s,a)=> s+(parseFloat(a.purchasePrice)||0), 0);
  const totalFeed = state.expenses.filter(e=>e.category==="علف").reduce((s,e)=> s+(parseFloat(e.amount)||0), 0);
  const totalVet = state.expenses.filter(e=>e.category!=="علف").reduce((s,e)=> s+(parseFloat(e.amount)||0), 0);
  const totalExpenses = totalFeed + totalVet;
  const netProfit = totalSales - totalPurchase - totalExpenses;
  return { totalSales, totalPurchase, totalFeed, totalVet, totalExpenses, netProfit };
}

// مصدر واحد مشترك لـ"إجمالي الزيادة في الوزن" للقطيع كله — بيستخدمه كفاءة التغذية ومتابعة الوزن الإجمالي
// الاتنين، عشان الـ FCR يفضل متطابق بينهم في كل الحالات: لو مدخل رقمين يدويين (الوزن عند الدخول والوزن
// الحالي) بيستخدمهم، ولو لأ بيجمع الزيادة من سجل الأوزان الفردي لكل حيوان.
function computeTotalHerdGain(){
  const manualEntry = parseFloat(state.config.totalEntryWeight) || 0;
  const manualCurrent = parseFloat(state.config.totalCurrentWeight) || 0;
  if(manualEntry > 0 && manualCurrent > 0){
    return manualCurrent - manualEntry;
  }
  const perf = computePerformance();
  return perf.reduce((s,p)=> s + ((p.gain!==null && p.gain>0) ? p.gain : 0), 0);
}

function computeFeedStats(){
  const totalGainKg = computeTotalHerdGain();
  const totalFeedKg = state.expenses.filter(e=>e.category==="علف" && (e.subType||'').trim()==="علف مركز").reduce((s,e)=> s+consumedQty(e), 0);
  const fin = computeFinancials();
  const fcr = (totalFeedKg>0 && totalGainKg>0) ? (totalFeedKg/totalGainKg) : null;

  // تكلفة العلف الفعلية: من الكمية المستهلكة فعليًا بس (مش المخزون كله — فيه نسب لسه متسجلة بالمخزون ومش مستهلكة،
  // زي التبن مثلاً ممكن 70% منه لسه في المخزن)، ومحصورة في أنواع العلف الأساسية: علف مركز، دريس، ردة، إضافات عليقة.
  const feedOnlyCost = state.expenses
    .filter(e=> e.category==="علف" && FEED_COST_SUBTYPES.includes((e.subType||'').trim()))
    .reduce((s,e)=>{
      // المخزون اتشال من التطبيق: تكلفة العلف = المبلغ المدفوع كامل لأنواع العلف الأساسية
      return s + (parseFloat(e.amount) || 0);
    }, 0);

  const costPerKgGainFeedOnly = (totalGainKg>0) ? (feedOnlyCost/totalGainKg) : null;
  const costPerKgGain = (totalGainKg>0) ? ((feedOnlyCost+fin.totalVet)/totalGainKg) : null;

  return { totalGainKg, totalFeedKg, fcr, feedOnlyCost, costPerKgGainFeedOnly, costPerKgGain };
}

function computeBreakEven(p, feedStats){
  if(p.gain === null || p.gain <= 0 || p.lastWeight === null) return null;
  if(feedStats.costPerKgGain === null) return null;
  const allocatedCost = feedStats.costPerKgGain * p.gain;
  const totalCost = (parseFloat(p.animal.purchasePrice)||0) + allocatedCost;
  return totalCost / p.lastWeight;
}

function computeGroupStats(perf, keyFn){
  const groups = {};
  perf.forEach(p=>{
    const key = (keyFn(p.animal) || '').trim() || 'غير محدد';
    if(!groups[key]) groups[key] = { count:0, sumRate:0, rateCount:0 };
    groups[key].count++;
    if(p.rate !== null){ groups[key].sumRate += p.rate; groups[key].rateCount++; }
  });
  return Object.entries(groups).map(([key,v])=> ({
    key, count: v.count, avgRate: v.rateCount ? (v.sumRate/v.rateCount) : null
  })).sort((x,y)=> (y.avgRate||-999)-(x.avgRate||-999));
}

function computeUpcomingHealth(){
  const today = new Date().toISOString().slice(0,10);
  return state.healthRecords.filter(h=> h.nextDueDate && daysBetween(today, h.nextDueDate) <= 7 && (!h.animalId || isActiveAnimal(state.animals.find(a=>a.id===h.animalId)))).length;
}

function computeMortality(){
  const deadAnimals = state.animals.filter(a=>a.status==="نافق");
  const mortalityLossValue = deadAnimals.reduce((s,a)=> s+(parseFloat(a.purchasePrice)||0), 0);
  return { count: deadAnimals.length, lossValue: mortalityLossValue };
}

// آخر وزنة متسجلة للحيوان (أحدث تاريخ)، حتى لو فيه تنبيه على بياناته
function latestWeightOf(an){
  const ex = animalExitDate(an);
  const ws = state.weights.filter(w=> w.animalId===an.id && w.date && !(ex && new Date(w.date) > new Date(ex)) && parseFloat(w.weight)>0);
  if(!ws.length) return null;
  ws.sort((a,b)=> new Date(a.date)-new Date(b.date));
  const last = ws[ws.length-1];
  return { date: last.date, weight: parseFloat(last.weight) };
}

// آخر جولة وزن للقطيع النشط بس: أحدث تاريخ اتوزن فيه أي حيوان نشط، ومجموع أوزان الحيوانات النشطة في اليوم ده
// (المباع والنافق مش بيدخلوا خالص، وكل حيوان بيتحسب مرة واحدة)
function latestActiveRound(){
  const active = state.animals.filter(isActiveAnimal);
  const activeIds = new Set(active.map(a=>a.id));
  let date = null;
  state.weights.forEach(w=>{ if(activeIds.has(w.animalId) && w.date && parseFloat(w.weight)>0 && (!date || new Date(w.date) > new Date(date))) date = w.date; });
  if(!date){
    const missingList = active.map(an=>({ animal: an, weight: parseFloat(an.purchaseWeight)||0, date: an.purchaseDate || null, source: 'purchase' }));
    return { date:null, roundTotal:0, total: missingList.reduce((x,m)=>x+m.weight,0), count:0, missing: missingList.length, missingList, activeCount: active.length };
  }
  const byAnimal = {};
  state.weights.forEach(w=>{ if(activeIds.has(w.animalId) && w.date===date && parseFloat(w.weight)>0) byAnimal[w.animalId] = parseFloat(w.weight); });
  const vals = Object.values(byAnimal);
  // الحيوانات النشطة اللي ما اتوزنتش في آخر جولة: بتتحسب بآخر وزن ليها (أو وزن الشراء لو عمرها ما اتوزنت) وبتظهر بالاسم
  const missingList = active.filter(an=> byAnimal[an.id] === undefined).map(an=>{
    const lw = latestWeightOf(an);
    return lw ? { animal: an, weight: lw.weight, date: lw.date, source: 'last' } : { animal: an, weight: parseFloat(an.purchaseWeight)||0, date: an.purchaseDate || null, source: 'purchase' };
  });
  const roundTotal = vals.reduce((x,y)=>x+y,0);
  const missingTotal = missingList.reduce((x,m)=>x+m.weight,0);
  return { date, roundTotal, total: roundTotal + missingTotal, count: vals.length, missing: missingList.length, missingList, activeCount: active.length };
}

function computeHerdSellTodayScenario(){
  const perf = computePerformance();
  const activeAnimals = perf.filter(p=>p.animal.status==="نشط");
  // الوزن الحالي = آخر جولة وزن بس (للحيوانات النشطة)
  const lr = latestActiveRound();
  const totalActiveWeight = lr.total;
  const priceEntry = getLatestMarketPrice();
  const price = priceEntry ? parseFloat(priceEntry.pricePerKg) : null;
  const projectedValue = (price!==null) ? totalActiveWeight * price : null;
  const fin = computeFinancials();
  // صافي الربح/الخسارة الكلي لو اتباع القطيع النشط النهاردة بالسعر ده، فوق إيراد أي مبيعات سابقة، مقابل كل المشتريات والمصاريف اللي اتصرفت على مر الوقت
  const totalPosition = (projectedValue!==null) ? (fin.totalSales + projectedValue - fin.totalPurchase - fin.totalExpenses) : null;
  return {
    activeCount: activeAnimals.length,
    totalActiveWeight, roundDate: lr.date, roundCount: lr.count, roundMissing: lr.missing, roundTotal: lr.roundTotal, missingList: lr.missingList,
    price,
    priceDate: priceEntry ? priceEntry.date : null,
    projectedValue,
    totalPosition,
  };
}

function lookupFeedingProgram(weightKg){
  if(!weightKg || weightKg <= 0) return null;
  let closest = null, minDiff = Infinity;
  FEEDING_PROGRAM.rows.forEach(r=>{
    const diff = Math.abs(r.bw - weightKg);
    if(diff < minDiff){ minDiff = diff; closest = r; }
  });
  return closest;
}

function lookupFeedRampup(daysSincePurchase){
  if(daysSincePurchase === null || daysSincePurchase === undefined) return null;
  const d = Math.max(1, daysSincePurchase); // يوم الدخول نفسه يتعامل معه كيوم 1
  if(d > FEED_RAMPUP.durationDays) return null; // خلص التدرج، يتحول للجدول التاني حسب الوزن
  return FEED_RAMPUP.rows.find(r=> d >= r.dayFrom && d <= r.dayTo) || null;
}

function computeHerdWeightStats(){
  const manualEntry = parseFloat(state.config.totalEntryWeight) || 0;
  const manualCurrent = parseFloat(state.config.totalCurrentWeight) || 0;
  const usingManual = manualEntry>0 && manualCurrent>0;

  const perf = computePerformance();
  const sumPurchaseWeight = state.animals.reduce((s,a)=> s+(parseFloat(a.purchaseWeight)||0), 0);
  const sumLastWeight = latestActiveRound().total;

  const totalEntryWeight = manualEntry>0 ? manualEntry : sumPurchaseWeight;
  const totalCurrentWeight = manualCurrent>0 ? manualCurrent : sumLastWeight;

  const totalFeedKg = state.expenses.filter(e=>e.category==="علف" && (e.subType||'').trim()==="علف مركز").reduce((s,e)=> s+consumedQty(e), 0);

  // نفس المصدر المشترك المستخدم في "كفاءة التغذية" بالظبط — فالـ FCR هنا وهناك يتطابقوا دايمًا، سواء مع إدخال يدوي أو من غيره
  let totalIncrease = computeTotalHerdGain();
  if(totalIncrease <= 0) totalIncrease = null;

  const herdFCR = (totalIncrease!==null && totalIncrease>0 && totalFeedKg>0) ? (totalFeedKg/totalIncrease) : null;

  const activeAnimals = state.animals.filter(a=>a.status==="نشط");
  const activePerf = perf.filter(p=>p.animal.status==="نشط");
  const lr = latestActiveRound();
  const avgActiveWeight = lr.activeCount>0 ? (lr.total/lr.activeCount) : null;

  return { totalCurrentWeight, totalEntryWeight, totalIncrease, totalFeedKg, herdFCR, usingManual, avgActiveWeight, activeCount: activeAnimals.length };
}

function computeHerdWeighingRounds(){
  // group every individual weight record by date, summing across all animals weighed that day
  const byDate = {};
  const exitById = {};
  state.animals.forEach(a=>{ exitById[a.id] = animalExitDate(a); });
  state.weights.forEach(w=>{
    if(!w.date) return;
    const ex = exitById[w.animalId];
    if(ex && new Date(w.date) > new Date(ex)) return; // بعد البيع/النفوق مش بيتحسب
    if(!byDate[w.date]) byDate[w.date] = { date: w.date, total: 0, count: 0, byAnimal: {} };
    byDate[w.date].total += (parseFloat(w.weight)||0);
    byDate[w.date].count += 1;
    byDate[w.date].byAnimal[w.animalId] = parseFloat(w.weight)||0;
  });
  // لو حيوان اتسجلتله أكتر من وزنة في نفس اليوم، يتحسب مرة واحدة بس (آخر وزنة)
  Object.values(byDate).forEach(r=>{ const vals = Object.values(r.byAnimal); r.count = vals.length; r.total = vals.reduce((x,y)=>x+y,0); });
  const dateRounds = Object.values(byDate).sort((a,b)=> new Date(a.date)-new Date(b.date));

  const manualStartWeight = parseFloat(state.config.totalEntryWeight) || 0;
  const sumPurchaseWeight = state.animals.reduce((s,a)=> s+(parseFloat(a.purchaseWeight)||0), 0);
  const startWeight = manualStartWeight > 0 ? manualStartWeight : sumPurchaseWeight;
  let startDate = state.config.totalEntryWeightDate || null;
  if(!startDate){
    const purchaseDates = state.animals.map(a=>a.purchaseDate).filter(Boolean).sort((a,b)=> new Date(a)-new Date(b));
    if(purchaseDates.length) startDate = purchaseDates[0];
  }

  const allRounds = [];
  if(startWeight > 0){
    allRounds.push({ date: startDate, isStart: true, total: startWeight, count: null });
  }
  dateRounds.forEach(r=> allRounds.push({ date: r.date, isStart: false, total: r.total, count: r.count, byAnimal: r.byAnimal }));
  const purchaseW = {};
  state.animals.forEach(a=>{ purchaseW[a.id] = parseFloat(a.purchaseWeight)||0; });
  const lastKnown = {};
  let runningCum = 0;

  let prev = null;
  const start = allRounds.find(r=>r.isStart) || null;
  const overrides = state.config.periodFeedOverrides || {};
  return allRounds.map(r=>{
    let delta = null, days = null, ratePerDay = null, cumulative = null, perAnimalRate = null;
    let periodFeedAuto = null, periodFeedManual = null, periodFeedKg = null, periodFCR = null;
    let periodFeedCost = null, periodCostPerKgGain = null;
    if(prev){
      if(r.byAnimal && !(prev.isStart && manualStartWeight > 0)){
        // الزيادة = مجموع زيادة كل حيوان اتوزن في الجولة دي عن آخر وزن معروف ليه (أو وزن شرائه)،
        // فخروج حيوان مباع أو نافق من القطيع مش بيظهر كأنه نقص في الوزن
        delta = 0;
        Object.keys(r.byAnimal).forEach(id=>{
          const base = (lastKnown[id] !== undefined) ? lastKnown[id] : purchaseW[id];
          if(base > 0) delta += r.byAnimal[id] - base;
        });
      } else {
        delta = r.total - prev.total;
      }
      if(prev.date && r.date){
        days = daysBetween(prev.date, r.date);
        if(days > 0){
          ratePerDay = delta / days;
          if(r.count > 0) perAnimalRate = (delta / r.count) / days;
        }
        periodFeedAuto = state.expenses.filter(e=>{
          if(e.category !== "علف" || (e.subType||'').trim() !== "علف مركز" || !e.date) return false;
          const d = new Date(e.date);
          return d > new Date(prev.date) && d <= new Date(r.date);
        }).reduce((s,e)=> s+consumedQty(e), 0);
        const manualVal = r.date ? parseFloat(overrides[r.date]) : NaN;
        periodFeedManual = (!isNaN(manualVal) && manualVal > 0) ? manualVal : null;
        periodFeedKg = periodFeedManual!==null ? periodFeedManual : (periodFeedAuto>0 ? periodFeedAuto : null);
        if(delta > 0 && periodFeedKg > 0) periodFCR = periodFeedKg / delta;

        periodFeedCost = state.expenses.filter(e=>{
          if(e.category !== "علف" || !FEED_COST_SUBTYPES.includes((e.subType||'').trim()) || !e.date) return false;
          const d = new Date(e.date);
          return d > new Date(prev.date) && d <= new Date(r.date);
        }).reduce((s,e)=>{
          return s + (parseFloat(e.amount) || 0);
        }, 0);
        if(delta > 0 && periodFeedCost > 0) periodCostPerKgGain = periodFeedCost / delta;
      }
    }
    if(start && !r.isStart){ runningCum += (delta || 0); cumulative = runningCum; }
    if(r.byAnimal) Object.keys(r.byAnimal).forEach(id=>{ lastKnown[id] = r.byAnimal[id]; });
    prev = r;
    return { ...r, delta, days, ratePerDay, cumulative, perAnimalRate, periodFeedAuto, periodFeedManual, periodFeedKg, periodFCR, periodFeedCost, periodCostPerKgGain };
  });
}

function computeRoundsInsights(weighingRounds){
  const completed = weighingRounds.filter(r=> r.perAnimalRate !== null);
  if(completed.length < 2) return null; // محتاج جولتين مكتملتين على الأقل عشان "أفضل/أسوأ" والاتجاه يكون ليهم معنى

  // اتجاه كل جولة مقارنة بالجولة اللي قبلها (فرق أكتر من 5% يعتبر تغيّر حقيقي، أقل من كده "ثابت")
  const withTrend = completed.map((r,i)=>{
    let trend = null;
    if(i>0){
      const prevRate = completed[i-1].perAnimalRate;
      if(prevRate > 0){
        const diffPct = (r.perAnimalRate - prevRate) / prevRate;
        trend = diffPct > 0.05 ? 'up' : (diffPct < -0.05 ? 'down' : 'flat');
      }
    }
    return { ...r, trend };
  });

  const threshold = parseFloat(state.config.threshold) || 0.6;
  const meetingTarget = completed.filter(r=> r.perAnimalRate >= threshold).length;
  const targetPct = (meetingTarget/completed.length)*100;

  let best = completed[0], worst = completed[0];
  completed.forEach(r=>{
    if(r.perAnimalRate > best.perAnimalRate) best = r;
    if(r.perAnimalRate < worst.perAnimalRate) worst = r;
  });

  return { withTrend, targetPct, meetingTarget, totalCompleted: completed.length, best, worst, threshold };
}

function computeNextRoundForecast(weighingRounds, overrideDays){
  const completed = weighingRounds.filter(r=> r.delta !== null && r.days !== null && r.days > 0);
  if(completed.length === 0) return null;

  const avgDelta = completed.reduce((s,r)=> s+r.delta, 0) / completed.length;
  const avgDays = completed.reduce((s,r)=> s+r.days, 0) / completed.length;
  const perAnimalRates = completed.filter(r=> r.perAnimalRate !== null).map(r=> r.perAnimalRate);
  const avgPerAnimalRate = perAnimalRates.length ? perAnimalRates.reduce((a,b)=>a+b,0)/perAnimalRates.length : null;

  const activeCount = state.animals.filter(a=>a.status==="نشط").length;
  const daysToUse = (overrideDays && overrideDays>0) ? overrideDays : avgDays;
  const expectedGain = (avgPerAnimalRate!==null) ? (avgPerAnimalRate * activeCount * daysToUse) : null;

  const lastRound = weighingRounds[weighingRounds.length-1];
  const lastRoundDate = lastRound ? lastRound.date : null;
  let nextRoundDate = null;
  if(lastRoundDate){
    const d = new Date(lastRoundDate);
    d.setDate(d.getDate() + Math.round(daysToUse));
    nextRoundDate = d.toISOString().slice(0,10);
  }

  return { roundsUsed: completed.length, avgDelta, avgDays, avgPerAnimalRate, activeCount, daysToUse, expectedGain, lastRoundDate, nextRoundDate };
}

function getLatestMarketPrice(){
  const list = state.marketPrices || [];
  if(list.length === 0) return null;
  const sorted = list.slice().sort((a,b)=> (new Date(a.date) - new Date(b.date)) || (a.id > b.id ? 1 : -1));
  return sorted[sorted.length - 1];
}

function computeFeedBreakdown(){
  const feedExpenses = state.expenses.filter(e=>e.category==="علف");
  const bySubtype = {};
  feedExpenses.forEach(e=>{
    const st = (e.subType||'').trim() || 'غير محدد';
    if(!bySubtype[st]) bySubtype[st] = { subType: st, stock: 0, consumed: 0, cost: 0, count: 0 };
    bySubtype[st].stock += stockQty(e);
    bySubtype[st].consumed += consumedQty(e);
    bySubtype[st].cost += (parseFloat(e.amount) || 0);
    bySubtype[st].count += 1;
  });
  const rows = Object.values(bySubtype).sort((a,b)=> b.cost - a.cost);
  const totals = rows.reduce((acc,r)=>({
    stock: acc.stock + r.stock,
    consumed: acc.consumed + r.consumed,
    cost: acc.cost + r.cost,
    count: acc.count + r.count,
  }), {stock:0, consumed:0, cost:0, count:0});
  return { rows, totals };
}

function bulkResolveConsumedFeed(){
  const todayStr = new Date().toISOString().slice(0,10);
  let resolvedCount = 0;
  state.expenses.forEach(e=>{
    if(e.category==="علف" && isLegacyQty(e) && !isRiceStraw(e)){
      const qty = parseFloat(e.quantityKg) || 0;
      e.stockKg = qty;
      e.consumedKg = qty;
      delete e.quantityKg;
      e.updatedAt = todayStr;
      resolvedCount += 1;
    }
  });
  return resolvedCount;
}

function computeFeasibilityModel(){
  const p = state.feasibility.params || {};
  const num = (k) => parseFloat(p[k]) || 0;

  const animalCount = num('animalCount');
  const startWeight = num('startWeight');
  const saleWeight = num('saleWeight');
  const days = num('fatteningDays');
  const avgWeight = (startWeight + saleWeight) / 2;

  const feedLine = (pctKey, priceKey) => {
    const tons = avgWeight * (num(pctKey)/100) * days * animalCount / 1000;
    return { tons, cost: tons * num(priceKey) };
  };
  const conc = feedLine('concentratePct','concentratePrice');
  const rough = feedLine('roughagePct','roughagePrice');
  const silage = feedLine('silagePct','silagePrice');
  const alfalfa = feedLine('alfalfaPct','alfalfaPrice');

  const buyCost = animalCount * startWeight * num('buyPricePerKg');
  const vetCost = animalCount * num('vetCostPerHead');
  const months = days / 30;
  const laborCost = (num('workerCount')*num('workerSalary') + num('engineerCount')*num('engineerSalary')
    + num('vetCount')*num('vetSalary') + num('managerCount')*num('managerSalary')) * months;
  const farmRent = num('farmRent');
  const depreciation = num('depreciation');
  const elecFuel = num('electricityWater') + num('fuel');
  const misc = num('misc');

  const saleRevenue = animalCount * saleWeight * num('sellPricePerKg');
  const manureRevenue = num('manureQty') * num('manurePrice');

  const computedExpenseRows = [
    { name: "علف مركز", qtyLabel: fmt(conc.tons,2)+' طن', total: conc.cost },
    { name: "علف خشن", qtyLabel: fmt(rough.tons,2)+' طن', total: rough.cost },
    { name: "سيلاج", qtyLabel: fmt(silage.tons,2)+' طن', total: silage.cost },
    { name: "برسيم", qtyLabel: fmt(alfalfa.tons,2)+' طن', total: alfalfa.cost },
    { name: "شراء العجول", qtyLabel: fmt(animalCount,0)+' رأس', total: buyCost },
    { name: "الرعاية البيطرية", qtyLabel: fmt(animalCount,0)+' رأس', total: vetCost },
    { name: "العمالة", qtyLabel: fmt(months,1)+' شهر', total: laborCost },
    { name: "إيجار المزرعة", qtyLabel: '-', total: farmRent },
    { name: "الإهلاك/الصيانة", qtyLabel: '-', total: depreciation },
    { name: "الكهرباء والماء والوقود", qtyLabel: '-', total: elecFuel },
    { name: "النثريات", qtyLabel: '-', total: misc },
  ];
  const computedRevenueRows = [
    { name: "بيع الحيوانات", qtyLabel: fmt(animalCount,0)+' رأس', total: saleRevenue },
    { name: "السماد", qtyLabel: fmt(num('manureQty'),1)+' م³', total: manureRevenue },
  ];

  const customExpenseItems = state.feasibility.customExpenseItems || [];
  const customRevenueItems = state.feasibility.customRevenueItems || [];
  const customExpTotal = customExpenseItems.reduce((s,i)=> s+((parseFloat(i.qty)||0)*(parseFloat(i.unitPrice)||0)), 0);
  const customRevTotal = customRevenueItems.reduce((s,i)=> s+((parseFloat(i.qty)||0)*(parseFloat(i.unitPrice)||0)), 0);

  const computedExpTotal = computedExpenseRows.reduce((s,r)=>s+r.total,0);
  const computedRevTotal = computedRevenueRows.reduce((s,r)=>s+r.total,0);
  const totalExpenses = computedExpTotal + customExpTotal;
  const totalRevenue = computedRevTotal + customRevTotal;
  const netProfit = totalRevenue - totalExpenses;
  const roi = totalExpenses>0 ? (netProfit/totalExpenses*100) : null;

  return { avgWeight, computedExpenseRows, computedRevenueRows, customExpenseItems, customRevenueItems, totalExpenses, totalRevenue, netProfit, roi };
}

function computeActionCenterAlerts(){
  const perf = computePerformance();
  const activeAnimals = perf.filter(p=>p.animal.status==="نشط");
  const todayStr = new Date().toISOString().slice(0,10);

  // 1) حيوانات لسه محتاجة توزن
  const staleDaysThreshold = parseFloat(state.config.staleWeightDaysThreshold) || 30;
  const staleAnimals = activeAnimals.map(p=>{
    const refDate = p.lastDate || p.animal.purchaseDate;
    const daysSince = refDate ? daysBetween(refDate, todayStr) : null;
    return { animal: p.animal, refDate, daysSince, neverWeighed: !p.lastDate };
  }).filter(x=> x.daysSince !== null && x.daysSince >= staleDaysThreshold)
    .sort((a,b)=> b.daysSince - a.daysSince);

  // 2) حيوانات قربت تخلص فترة تدرج العلف
  const rampupWarnDays = parseFloat(state.config.rampupEndingWarnDays) || 10;
  const rampupEnding = activeAnimals.map(p=>{
    const daysSince = p.animal.purchaseDate ? daysBetween(p.animal.purchaseDate, todayStr) : null;
    return { animal: p.animal, daysSince, daysLeft: daysSince!==null ? (FEED_RAMPUP.durationDays - daysSince) : null };
  }).filter(x=> x.daysSince !== null && x.daysSince >= (FEED_RAMPUP.durationDays - rampupWarnDays) && x.daysSince <= FEED_RAMPUP.durationDays)
    .sort((a,b)=> a.daysLeft - b.daysLeft);

  // 3) حيوانات قريبة من الوزن المستهدف
  const targetWeight = parseFloat(state.config.targetWeightKg) || null;
  const nearTargetWarnDays = parseFloat(state.config.nearTargetWarnDays) || 14;
  let nearTarget = [];
  if(targetWeight){
    const needResult = computeFeedNeedToTarget(targetWeight);
    nearTarget = needResult.results
      .filter(r=> r.days !== null && r.days <= nearTargetWarnDays && !r.reached && !r.unreachable)
      .sort((a,b)=> a.days - b.days);
  }

  return { staleAnimals, staleDaysThreshold, rampupEnding, rampupWarnDays, targetWeight, nearTarget, nearTargetWarnDays };
}

function herdAvgDailyGain(perf){
  const rates = (perf || computePerformance()).filter(p=> p.animal.status==="نشط" && p.rate!==null && p.rate>0).map(p=>p.rate);
  return rates.length ? rates.reduce((a,b)=>a+b,0)/rates.length : null;
}

function computeFeedNeedToTarget(targetWeightKg){
  const perf = computePerformance();
  const activeAnimals = perf.filter(p=>p.animal.status==="نشط");
  const MAX_DAYS = 500;

  const results = activeAnimals.map(p=>{
    const w0 = p.lastWeight!==null ? p.lastWeight : parseFloat(p.animal.purchaseWeight);
    const lastWeightDate = p.lastDate || p.animal.purchaseDate || null;
    if(!w0 || w0<=0) return { animal: p.animal, w0: null, days: null, concKg: null, fillerKg: null, reached: false, unreachable: false, lastWeightDate };

    if(w0 >= targetWeightKg){
      return { animal: p.animal, w0, days: 0, concKg: 0, fillerKg: 0, reached: true, unreachable: false, lastWeightDate };
    }

    let dailyGain;
    if(p.rate !== null){
      // فيه معدل زيادة محسوب فعليًا من وزنتين أو أكتر — استخدمه زي ما هو، حتى لو صفر أو سالب
      dailyGain = p.rate;
    } else {
      // لسه مفيش بيانات كفاية لحساب معدل فعلي لهذا الحيوان — استخدم متوسط الزيادة الفعلي للقطيع النشط
      // (جدول التغذية الرئيسي ما فيهوش معدل زيادة متوقع)
      dailyGain = herdAvgDailyGain(perf) || 0;
    }
    if(!dailyGain || dailyGain<=0){
      return { animal: p.animal, w0, days: null, concKg: null, fillerKg: null, reached: false, unreachable: true, lastWeightDate };
    }

    let concKg = 0, fillerKg = 0, strawKg = 0, hayKg = 0, branKg = 0, molassesKg = 0, d = 0, w = w0;
    while(w < targetWeightKg && d < MAX_DAYS){
      d += 1;
      w = w0 + dailyGain*d;
      const row = lookupFeedingProgram(Math.min(w, targetWeightKg));
      if(row){
        concKg += row.conc; fillerKg += row.filler;
        strawKg += row.straw; hayKg += row.hay; branKg += row.bran; molassesKg += row.molassesG/1000;
      }
    }
    const unreachable = (d >= MAX_DAYS && w < targetWeightKg);
    const nz = v => unreachable ? null : v;
    return { animal: p.animal, w0, days: nz(d), concKg: nz(concKg), fillerKg: nz(fillerKg), strawKg: nz(strawKg), hayKg: nz(hayKg), branKg: nz(branKg), molassesKg: nz(molassesKg), reached: false, unreachable, lastWeightDate };
  });

  const valid = results.filter(r=> r.days !== null);
  const totals = {
    activeCount: activeAnimals.length,
    countedCount: valid.length,
    totalConcKg: valid.reduce((s,r)=> s+(r.concKg||0), 0),
    totalFillerKg: valid.reduce((s,r)=> s+(r.fillerKg||0), 0),
    totalStrawKg: valid.reduce((s,r)=> s+(r.strawKg||0), 0),
    totalHayKg: valid.reduce((s,r)=> s+(r.hayKg||0), 0),
    totalBranKg: valid.reduce((s,r)=> s+(r.branKg||0), 0),
    totalMolassesKg: valid.reduce((s,r)=> s+(r.molassesKg||0), 0),
    maxDays: valid.length ? Math.max(...valid.map(r=>r.days)) : null,
  };

  return { results, totals };
}

function computeProfitability(perf, feedStats, marketPrice){
  return perf
    .filter(p => p.animal.status === "نشط" && p.lastWeight !== null && p.gain !== null)
    .map(p => {
      const allocatedCost = (feedStats.costPerKgGain !== null) ? feedStats.costPerKgGain * Math.max(0,p.gain) : null;
      const totalCost = (parseFloat(p.animal.purchasePrice) || 0) + (allocatedCost !== null ? allocatedCost : 0);
      const expectedValue = (marketPrice !== null) ? p.lastWeight * marketPrice : null;
      const profit = (expectedValue !== null) ? expectedValue - totalCost : null;
      const marginalPerKg = (marketPrice !== null && feedStats.costPerKgGain !== null) ? (marketPrice - feedStats.costPerKgGain) : null;
      return { animal: p.animal, lastWeight: p.lastWeight, totalCost, expectedValue, profit, marginalPerKg };
    })
    .sort((a,b)=> (b.profit ?? -Infinity) - (a.profit ?? -Infinity));
}

تياطية": "Import backup", "هذا نظام لإدارة بيانات مزرعتك بالكامل، مبني على نفس منطق ملف الإكسل الأصلي — لكن بدون الحاجة لكتابة أي معادلة يدويًا.": "This is a complete farm data management system, built on the same logic as the original Excel file — without writing any formulas by hand.", "{0}) الجدوى المالية:": "{0}) Feasibility Study:", "دراسة مالية مستقلة تمامًا عن بيانات حيواناتك الفعلية، ومبنية على معادلات: غيّر أي رقم في المدخلات (سعر الشراء، سعر البيع، نسبة العلف من وزن الجسم، عدد الأيام، الأسعار، الرواتب...) وكل الكميات والتكاليف والإيرادات وصافي الربح والعائد على الاستثمار (ROI) بتتغير لحظيًا. تقدر تضيف أي بند مصروف أو إيراد إضافي (اسم × كمية × سعر الوحدة) أو تعدّله أو تحذفه في أي وقت من غير ما تحتاج تكلمني.": "A financial study fully separate from your real animal data, driven by formulas: change any input (purchase price, sale price, feed % of body weight, days, prices, salaries...) and all quantities, costs, revenue, net profit and ROI update instantly. You can add, edit or delete any extra expense or revenue item (name × quantity × unit price) at any time.", "{0}) الحيوانات:": "{0}) Animals:", "سجّل بيانات كل حيوان مرة واحدة عند الشراء. تقدر تعدّل أي بيانات لاحقًا من زرار \"تعديل\"، وحذف الحيوان بيمسح معاه أوزانه ومبيعاته وسجله الصحي.": "Record each animal once at purchase. You can edit any data later with the \"Edit\" button; deleting an animal also deletes its weights, sales and health records.", "{0}) سجل الأوزان:": "{0}) Weight Log:", "كل عملية وزن (أسبوعيًا مثلاً) تُضاف كسطر جديد — بدون حد أقصى، وتقدر تعدّل أي وزنة غلط منها مباشرة.": "Each weighing (weekly, for example) is added as a new row — no limit — and you can fix any wrong weighing directly.", "{0}) تحليل الأداء:": "{0}) Performance:", "يحسب تلقائيًا معدل الزيادة اليومي لكل حيوان، ويصنّف الأداء (ممتاز / جيد / ضعيف / تحذير)، ويقدّر \"سعر التعادل\" لكل حيوان (أقل سعر بيع تقريبًا عشان متخسرش)، ومقارنة حسب المورد والعنبر.": "Automatically calculates each animal's daily gain, rates performance (Excellent / Good / Weak / Warning), estimates each animal's \"break-even price\" (roughly the lowest sale price to avoid a loss), and compares by supplier and pen.", "{0}) السجل الصحي:": "{0}) Health Record:", "سجّل التحصينات والعلاجات والفحوصات لكل حيوان، مع إمكانية تسجيل موعد الجرعة/الفحص القادم — والنظام بينبهك لما يقرب أو يتأخر.": "Record vaccinations, treatments and checks for each animal, with an optional next dose/check date — the system alerts you when it is close or overdue.", "{0}) المصاريف:": "{0}) Expenses:", "سجّل مصاريف العلف (بالكمية بالكجم كمان عشان يتحسب معدل تحويل العلف FCR)، وكل حاجة خاصة بالبيطري، والنظام بيجمعهم تلقائيًا.": "Record feed expenses (with the quantity in kg so FCR can be calculated) and all veterinary costs; the system totals them automatically.", "{0}) لوحة التحكم:": "{0}) Dashboard:", "أهم الأرقام في صفحة واحدة، مع ملخص مالي، وكفاءة التغذية (FCR ومتوسط تكلفة الكيلو)، وعدد الحالات النافقة وخسائرها. وتحت جدول \"جولات الوزن\"، هتلاقي \"الزيادة المتوقعة في الجولة الجاية\" — بيتحسب تلقائيًا من تاريخ آخر جولة وزن مسجلة ومتوسط الفترة بين جولاتك (غالبًا حوالي {0} يوم)، ويديك الزيادة الكلية المتوقعة للقطيع النشط وتاريخ الجولة الجاية المتوقع. لو عايز فترة مختلفة عن المتوسط، اكتبها في الخانة وهيحدّث الحساب والتاريخ فورًا.": "The key numbers on one page: financial summary, feed efficiency (FCR and average cost per kg), and deaths and their losses. Below the \"Weighing rounds\" table you'll find \"Expected gain next round\" — calculated automatically from your last weighing round date and the average gap between rounds (usually about {0} days), giving the expected total gain for the active herd and the expected next round date. To use a different gap, type it in the box and the numbers and date update instantly.", "{0}) المبيعات:": "{0}) Sales:", "سجّل بيانات البيع — والحيوان يتحول تلقائيًا لحالة \"مباع\". وفيه حالة \"نافق\" لتسجيل نفوق أي حيوان بدل ما يختفي من غير حساب. الجدول بيوريك \"هامش البيع\" (سعر البيع − سعر الشراء بس) و\"صافي الربح الحقيقي\" (بعد خصم نصيب الحيوان التقديري من تكلفة العلف والرعاية الصحية، محسوب من متوسط كفاءة القطيع × الزيادة اللي حققها هو بالذات) — الرقمين مختلفين عمدًا عشان توضحلك إن البيع ممكن يكون شكله مربح على الورق بس فعليًا خسران لما تحسب تكلفة التربية.": "Record sales — the animal is automatically marked \"Sold\". There is also a \"Dead\" status to record deaths instead of animals disappearing unaccounted. The table shows the \"sale margin\" (sale price − purchase price only) and the \"true net profit\" (after deducting the animal's estimated share of feed and health costs, based on herd average efficiency × that animal's own gain) — the two differ on purpose to show that a sale can look profitable on paper but actually lose money once raising costs are counted.", "{0}) سعر السوق وتقرير الربحية (في تحليل الأداء):": "{0}) Market price & profitability report (in Performance):", "سجّل سعر الكيلو الحي في السوق كل ما يتغير. النظام بيقارنه بمتوسط سعر التعادل تلقائيًا، وتحت في نفس الصفحة هتلاقي تقرير لكل حيوان نشط بالتكلفة الإجمالية والقيمة المتوقعة وهامش الربح، مع قرار \"استمر في التسمين\" أو \"قرّب موعد البيع\" حسب مقارنة تكلفة الكيلو الإضافي بسعر السوق. نفس السعر ده تقدر كمان تحدّثه بسرعة من \"لوحة التحكم\" في كارت \"الملخص المالي\" — في قسم \"لو بعت القطيع النشط كله النهاردة؟\"، اللي بيوريك صافي ربح أو خسارة كلي متوقع لو بعت كل القطيع النشط دلوقتي بالسعر ده (بيحسبه من الوزن الإجمالي الحالي للحيوانات النشطة مقابل كل المشتريات والمصاريف من أول ما بدأت).": "Record the live market price per kg whenever it changes. The system compares it with the average break-even price automatically, and on the same page you'll find a report for each active animal with total cost, expected value and profit margin, plus a \"Keep fattening\" or \"Sell soon\" decision based on the cost of the extra kg versus the market price. You can also update this price quickly from the Dashboard — in \"Sell the whole active herd today?\", which shows the expected total profit or loss if you sold the whole active herd now at that price (from the current total weight of active animals against all purchases and expenses since you started).", "{0}) توقع الاحتياج حتى وزن مستهدف (في برنامج التغذية):": "{0}) Feed needed to reach a target weight (in Feeding Program):", "حدد الوزن اللي عايز تربي الحيوانات لحده، والنظام هياخد آخر وزن مسجل لكل حيوان نشط ومعدل زيادته (الفعلي لو متسجل، أو المتوقع من جدول برنامج التغذية لو لسه مفيش بيانات كفاية)، ويحسب يوم بيوم كام كيلو علف مركز وكام كيلو مالئ/خشن محتاج لحد ما يوصل للوزن ده — مع تحديث نوع العليقة تلقائيًا كل ما الوزن يزيد. بيديك كمان تاريخ تقريبي متوقع للوصول لكل حيوان. ده تقدير تخطيطي بيفترض استمرار نفس معدل الزيادة ومفيش حيوانات جديدة هتتضاف أو هتتباع في الأثناء — مش رقم مضمون.": "Set the weight you want to raise the animals to; the system takes each active animal's last recorded weight and gain rate (actual if recorded, or expected from the feeding table if there isn't enough data yet) and calculates day by day how many kg of concentrate and filler/roughage are needed to reach it — updating the ration as weight increases. It also gives an approximate arrival date for each animal. This is a planning estimate that assumes the same gain rate and no animals added or sold meanwhile — not a guaranteed number.", "{0}) خطة تدرج العلف عند الدخول (في برنامج التغذية):": "{0}) Feed ramp-up plan at entry (in Feeding Program):", "جدول مرجعي لأول {0} يوم من عمر أي عجل جديد في المزرعة — علف مركز لكل عجل/يوم بغض النظر عن حجم القطيع (بيبدأ {1} كجم ويزيد {2} كجم كل يومين لحد ما يوصل {3} كجم في اليوم الخمسين)، عشان كرش العجل يتعود على العلف المركز تدريجيًا من غير مشاكل هضمية. تحت الجدول هتلاقي أي حيوان نشط لسه في أول {4} يوم من تاريخ شرائه، مع المرحلة والكمية الموصى بها له اليوم تلقائيًا. بعد ما العجل يعدي الـ{5} يوم، يتحول لجدول \"برنامج التغذية\" الرئيسي حسب وزنه.": "A reference table for the first {0} days of any new calf on the farm — concentrate per calf per day regardless of herd size (starts at {1} kg and rises {2} kg every two days until it reaches {3} kg on day fifty), so the calf's rumen adapts to concentrate gradually without digestive problems. Below the table you'll see any active animal still within its first {4} days after purchase, with today's recommended stage and amount. After {5} days the calf moves to the main \"Feeding Program\" table by weight.", "رسائل التنبيه:": "Alert messages:", "بيانات غير كافية": "Insufficient data", ": الحيوان لسه ملوش أي وزنة مسجلة.": ": the animal has no recorded weighing yet.", "خطأ بالتواريخ": "Date error", ": تاريخ آخر وزن هو نفسه تاريخ الشراء أو قبله.": ": the last weighing date is the same as or before the purchase date.", "وزن الشراء غير صحيح": "Invalid purchase weight", ": وزن الشراء فارغ أو صفر.": ": purchase weight is empty or zero.", "تكرار بيانات": "Duplicate data", ": فيه أكتر من وزنة في نفس التاريخ لنفس الحيوان.": ": more than one weighing on the same date for the same animal.", "كل البيانات بتتحفظ تلقائيًا على جهازك، ومش هتضيع لو قفلت الصفحة — لكن ده مش بديل عن نسخة احتياطية (شوف فوق).": "All data is saved automatically on your device and won't be lost if you close the page — but that is not a substitute for a backup (see above).", "مسح كل البيانات والبدء من جديد": "Delete all data and start over", "{0} جنيه": "{0} EGP", "+{0} جنيه": "+{0} EGP", "خسارة {0} جنيه": "Loss {0} EGP", "ربح {0} جنيه": "Profit {0} EGP", "خسارة": "Loss", "ربح": "Profit", "جولات الوزن": "Weighing rounds", "جولات الوزن — التقدم من جولة للتانية": "Weighing Rounds — Round-to-Round Progress", "عدد الحيوانات الموزونة": "Animals weighed", "إجمالي الوزن (كجم)": "Total weight (kg)", "الزيادة عن آخر جولة": "Gain since last round", "الزيادة الكلية من البداية": "Total gain since start", "عدد الأيام": "Days", "معدل القطيع اليومي (كجم/يوم)": "Herd daily rate (kg/day)", "معدل الحيوان الواحد اليومي (كجم/يوم)": "Per-animal daily rate (kg/day)", "الاتجاه": "Trend", "كمية العلف للفترة (كجم)": "Feed for the period (kg)", "FCR الفترة": "Period FCR", "تكلفة الكيلو زيادة (جنيه)": "Cost per kg gain (EG const I18N_PHRASE_RE = (()=>{
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const list = Object.keys(I18N_EN).filter(k=> !/\{\d+\}/.test(k) && AR_RE.test(k)).sort((a,b)=> b.length - a.length);
  return new RegExp('(?<![\\u0600-\\u06FF])(?:' + list.map(esc).join('|') + ')(?![\\u0600-\\u06FF])', 'g');
})();
function trStr(raw){
  if(raw === null || raw === undefined) return raw;
  raw = String(raw);
  if(!AR_RE.test(raw)) return raw;
  const lead = raw.match(/^\s*/)[0], trail = raw.match(/\s*$/)[0];
  const n = raw.replace(/\s+/g,' ').trim();
  const nums = [];
  const k = n.replace(NUM_RE, m=>{ nums.push(m); return '{'+(nums.length-1)+'}'; });
  const v = I18N_EN[k];
  if(v !== undefined) return lead + v.replace(/\{(\d+)\}/g, (m,i)=> nums[+i]!==undefined ? nums[+i] : m) + trail;
  return raw.replace(I18N_PHRASE_RE, m=> I18N_EN[m]);
}
const I18N_ATTRS = ['placeholder','title','aria-label'];
function i18nNode(node){
  const p = node.parentElement;
  if(!p || p.closest('script,style,textarea')) return;
  const val = node.nodeValue;
  if(!val || !AR_RE.test(val)) return;
  if(p.tagName === 'OPTION' && !p.hasAttribute('value')) p.setAttribute('value', p.text); // keep the Arabic value the app logic uses
  node.__ar = val;
  const t = trStr(val);
  if(t !== val) node.nodeValue = t;
}
function i18nAttrs(el){
  I18N_ATTRS.forEach(a=>{
    const v = el.getAttribute && el.getAttribute(a);
    if(v && AR_RE.test(v)){ const t = trStr(v); if(t !== v){ el.setAttribute('data-ar-'+a, v); el.setAttribute(a, t); } }
  });
}
function i18nTree(root){
  if(root.nodeType === 3){ i18nNode(root); return; }
  if(root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; const list = [];
  while((n = w.nextNode())) list.push(n);
  list.forEach(i18nNode);
  i18nAttrs(root);
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(i18nAttrs);
}
function i18nRestore(){
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())){ if(n.__ar !== undefined){ n.nodeValue = n.__ar; delete n.__ar; } }
  I18N_ATTRS.forEach(a=> document.querySelectorAll('[data-ar-'+a+']').forEach(el=>{ el.setAttribute(a, el.getAttribute('data-ar-'+a)); el.removeAttribute('data-ar-'+a); }));
}
let i18nObserver = null;
function startI18n(){
  if(!i18nObserver){
    i18nObserver = new MutationObserver(muts=>{
      muts.forEach(m=>{
        if(m.type === 'childList') m.addedNodes.forEach(i18nTree);
        else if(m.type === 'characterData') i18nNode(m.target);
        else if(m.type === 'attributes') i18nAttrs(m.target);
      });
    });
  }
  i18nObserver.observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:I18N_ATTRS});
  i18nTree(document.body);
}
function stopI18n(){ if(i18nObserver) i18nObserver.disconnect(); i18nRestore(); }

  document.documentElement.setAttribute('data-theme', uiPrefs.theme);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', uiPrefs.theme === 'dark' ? '#0E0E0F' : '#F4F4F1');

function applyLang(rerender){
  const h = document.documentElement;
  const en = uiPrefs.lang === 'en';
  h.setAttribute('lang', en ? 'en' : 'ar');
  h.setAttribute('dir', en ? 'ltr' : 'rtl');
  document.title = en ? 'Farm Data Management' : 'نظام إدارة بيانات المزرعة';

// الوزن = (محيط الصدر² × طول الجسم) ÷ ثابت النوع — نفس المعادلات بالظبط
const SCALE_SPECIES = [
  { id:'cow',     label:'بقرة',  emoji:'🐄', k:10840, min:40, max:1200, small:250, large:500 },
  { id:'buffalo', label:'جاموس', emoji:'🐃', k:10600, min:40, max:1300, small:250, large:550 },
  { id:'sheep',   label:'خروف',  emoji:'🐑', k:11500, min:8,  max:150,  small:30,  large:60  },
  { id:'goat',    label:'ماعز',  emoji:'🐐', k:11500, min:5,  max:120,  small:25,  large:50  },
];
let scaleSub = 'measure';
let scaleSpecies = 'cow';
let scaleGirth = '';
let scaleLength = '';
let scaleDialog = null;

function localToday(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function scaleCalc(speciesId, girth, length){
  const sp = SCALE_SPECIES.find(s=>s.id===speciesId) || SCALE_SPECIES[0];
  const g = parseFloat(girth), l = parseFloat(length);
  if(!(g>0) || !(l>0)) return { sp, weight:null };
  const weight = (g*g*l) / sp.k;
  const unusual = weight < sp.min || weight > sp.max;
  const size = weight < sp.small ? 'صغير' : (weight > sp.large ? 'كبير' : 'متوسط');
  return { sp, weight, unusual, size };
}

      </div>
      ${r.weight!==null && r.unusual ? `<div class="sc-warn">${scIcon('warn')}<span>الوزن التقديري غير معتاد لهذا النوع. تحقق من القياسات.</span></div>` : ''}
      <div class="sc-formula">المعادلة: (محيط الصدر² × طول الجسم) ÷ ${sp.k}</div>
    </div>`;
}

function scaleDialogHtml(){
  if(!scaleDialog) return '';
  const r = scaleCalc(scaleSpecies, scaleGirth, scaleLength);
  const wantCattle = scaleSpecies==='cow' ? 'بقري' : (scaleSpecies==='buffalo' ? 'جاموسي' : null);
  const active = state.animals.filter(a=>a.status==='نشط');
  const sorted = active.slice().sort((a,b)=>{
    const ma = wantCattle && (a.type||'').includes(wantCattle) ? 0 : 1;
    const mb = wantCattle && (b.type||'').includes(wantCattle) ? 0 : 1;
    return (ma-mb) || String(a.tagNumber).localeCompare(String(b.tagNumber), 'ar', {numeric:true});
  });
  const today = localToday();
  const opts = sorted.map(a=>{
    const same = state.weights.some(w=>w.animalId===a.id && w.date===today);

      <div><div class="sc-dlg-w"><span dir="ltr" style="unicode-bidi:isolate">${r.weight.toFixed(1)}</span> كجم</div>
      <div class="sc-dlg-sub">${r.sp.label} · طول الجسم ${scaleLength} سم · محيط الصدر ${scaleGirth} سم</div></div>
    </div>
    <label for="scaleAnimalSel">اربط الوزن بأي حيوان؟</label>
    <select id="scaleAnimalSel">
      ${opts}
      <option value="">بدون ربط — حفظ في سجل القياسات بس</option>
    </select>
    <div class="sc-dlg-date">هيتسجل في سجل الأوزان بتاريخ النهاردة: <b dir="ltr" style="unicode-bidi:isolate;display:inline-block">${today}</b></div>
    <div class="sc-dlg-actions">
      <button class="btn primary" type="button" data-scale-confirm>${scIcon('save')} حفظ</button>
      <button class="btn secondary" type="button" data-scale-cancel>إلغاء</button>

        <div><label for="scaleGirth"><span class="sc-step">2</span> محيط الصدر (سم)</label><input id="scaleGirth" type="number" inputmode="decimal" step="any" min="0" value="${scaleGirth}" placeholder="مثلاً: 160"></div>

        <td>${m.length} × ${m.girth}</td>
        <td><b>${(+m.weight).toFixed(1)}</b></td>
        <td class="text">${an ? `<span class="tag">${an.tagNumber}</span>` : (m.animalId ? 'حيوان محذوف' : 'غير مربوط')}</td>

    }).join('');

    <div class="card">
      <h2>سجل القياسات <span class="i18n-en">Measurements</span> (${list.length})</h2>
      ${list.length===0 ? `<div class="empty">لسه مفيش قياسات محفوظة</div>` : `
      <div class="table-scroll"><table>

        <li><span class="sc-n">3</span><div><b>أدخل القياسات:</b> سجّل القيم بالسنتيمتر وسيتم حساب الوزن التقديري تلقائياً.</div></li>

    </div>
    <div class="card">
      <h2 class="sc-h">📐 معادلات الوزن</h2>

function attachScaleHandlers(){
  document.querySelectorAll('[data-scale-sub]').forEach(b=> b.addEventListener('click', ()=>{ scaleSub = b.dataset.scaleSub; render(); }));
  document.querySelectorAll('[data-scale-species]').forEach(b=> b.addEventListener('click', ()=>{ scaleSpecies = b.dataset.scaleSpecies; render(); }));
  const g = document.getElementById('scaleGirth'), l = document.getElementById('scaleLength');
  const upd = ()=>{ scaleGirth = g.value; scaleLength = l.value; const box = document.getElementById('scaleResult'); if(box) box.innerHTML = scaleResultHtml(); };
  if(g) g.addEventListener('input', upd);
  if(l) l.addEventListener('input', upd);
  document.querySelectorAll('[data-scale-reset]').forEach(b=> b.addEventListener('click', ()=>{ scaleGirth=''; scaleLength=''; render(); }));
  document.querySelectorAll('[data-scale-save]').forEach(b=> b.addEventListener('click', ()=>{
    const r = scaleCalc(scaleSpecies, scaleGirth, scaleLength);
    if(r.weight === null){ showToast('أدخل طول الجسم ومحيط الصدر الأول'); return; }
    scaleDialog = { open:true };
    render();
    const sel = document.getElementById('scaleAnimalSel'); if(sel) sel.focus();
  }));
  document.querySelectorAll('[data-scale-cancel]').forEach(b=> b.addEventListener('click', ()=>{ scaleDialog = null; render(); }));
  document.querySelectorAll('[data-scale-confirm]').forEach(b=> b.addEventListener('click', async ()=>{
    const r = scaleCalc(scaleSpecies, scaleGirth, scaleLength);
    if(r.weight === null){ scaleDialog = null; render(); return; }
    const animalId = (document.getElementById('scaleAnimalSel')||{}).value || '';
    const today = localToday();
    const weight = Math.round(r.weight*10)/10;
    if(!Array.isArray(state.measurements)) state.measurements = [];
    const m = { id: uid(), date: today, createdAt: Date.now(), species: scaleSpecies, girth: parseFloat(scaleGirth), length: parseFloat(scaleLength), k: r.sp.k, weight, animalId: animalId || null, weightId: null };
    let msg = 'تم حفظ القياس في سجل القياسات';
    if(animalId){
      const existing = state.weights.find(w=>w.animalId===animalId && w.date===today);
      if(existing){ existing.weight = String(weight); existing.source = 'scale'; existing.measurementId = m.id; m.weightId = existing.id; }
      else { const w = { id: uid(), animalId, date: today, weight: String(weight), source: 'scale', measurementId: m.id }; state.weights.push(w); m.weightId = w.id; }
      const an = state.animals.find(a=>a.id===animalId);
      msg = `تم حفظ القياس وتسجيل ${weight} كجم في سجل أوزان الحيوان ${an ? an.tagNumber : ''}`;
      await persist('weights');
    }
    state.measurements.push(m);
    await persist('measurements');
    scaleDialog = null;
    showToast(msg);
    render();
  }));
  document.querySelectorAll('[data-scale-del]').forEach(b=> b.addEventListener('click', async ()=>{
    const m = (state.measurements||[]).find(x=>x.id===b.dataset.scaleDel);
    if(!m) return;
    const linked = m.weightId ? state.weights.find(w=>w.id===m.weightId && w.measurementId===m.id) : null;
    if(!(await appConfirm(linked ? 'حذف القياس؟ الوزنة اللي اتسجلت منه في سجل الأوزان هتتمسح كمان.' : 'حذف القياس؟'))) return;
    state.measurements = state.measurements.filter(x=>x.id!==m.id);
    if(linked){ state.weights = state.weights.filter(w=>w.id!==linked.id); await persist('weights'); }
    await persist('measurements');
    render();
  }));
}

function applyDisplay(){
  const h = document.documentElement;

function displaySettingsHtml(){
  const seg = (key, list) => list.map(o=>`<button type="button" class="ds-opt ${((uiPrefs[key]||'')===o.id)?'active':''}" data-ds-key="${key}" data-ds-val="${o.id}" ${key==='font'?`style="font-family:${o.stack}"`:''}>${o.label}</button>`).join('');

function openDisplaySettings(){
  let box = document.getElementById('dispSettings');

  box.querySelectorAll('[data-ds-key]').forEach(btn=> btn.addEventListener('click', ev=>{

    uiPrefs[btn.dataset.dsKey] = btn.dataset.dsVal; saveUiPrefs(); applyDisplay(); openDisplaySettings();
  }));
  box.querySelectorAll('[data-ds-close]').forEach(btn=> btn.addEventListener('click', ev=>{ ev.stopPropagation(); closeDisplaySettings(); }));

function closeDisplaySettings(){ const box = document.getElementById('dispSettings'); if(box) box.innerHTML = ''; }
if(!uiPrefs.font) uiPrefs.font = 'tajawal';
if(!uiPrefs.size) uiPrefs.size = 'large';
if(!uiPrefs.weight) uiPrefs.weight = 'normal';

// ---------- رسائل تأكيد ونسخ احتياطي جوه التطبيق (بتشتغل في أي متصفح، حتى لو الصفحة مفتوحة من رابط) ----------
const IN_FRAME = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
function appModal(html){
  let box = document.getElementById('appModal');
  if(!box){ box = document.createElement('div'); box.id = 'appModal'; document.body.appendChild(box); }
  box.innerHTML = html;
  return box;
}
function closeAppModal(){ const box = document.getElementById('appModal'); if(box) box.innerHTML = ''; }
function appConfirm(message, okLabel){
  return new Promise(resolve=>{
    const box = appModal(`
      <div class="sc-modal-back" data-cf="no"></div>
      <div class="sc-modal" role="alertdialog" aria-modal="true" aria-labelledby="cfMsg">
        <h3 id="cfMsg" style="font-size:16px;line-height:1.7">${message}</h3>
        <div class="sc-dlg-actions">
          <button class="btn danger" type="button" data-cf="yes">${okLabel || 'نعم، متأكد'}</button>
          <button class="btn secondary" type="button" data-cf="no">إلغاء</button>
        </div>
      </div>`);
    const done = v => { closeAppModal(); resolve(v); };
    box.querySelectorAll('[data-cf]').forEach(b=> b.addEventListener('click', ()=> done(b.dataset.cf === 'yes')));
    const yes = box.querySelector('[data-cf="yes"]'); if(yes) yes.focus();
  });
}

// ---------- تعديل جولة وزن (أي جولة) ----------
function roundAnimalsFor(date){
  return state.animals.filter(a=>{
    if(state.weights.some(w=>w.animalId===a.id && w.date===date)) return true;
    if(a.purchaseDate && a.purchaseDate > date) return false;
    const ex = animalExitDate(a);
    if(ex && ex < date) return false;
    if(!ex && !isActiveAnimal(a)) return false;
    return true;
  }).sort(edSortTag);
}
function edSumUpdate(box, sel, out){
  let sum = 0, cnt = 0;
  box.querySelectorAll(sel).forEach(i=>{ const v = parseFloat(i.value); if(v>0){ sum += v; cnt++; } });
  out(sum, cnt);
}
function openRoundEditModal(date){
  const animals = roundAnimalsFor(date);
  const cur = {};
  state.weights.filter(w=>w.date===date).forEach(w=>{ cur[w.animalId] = w.weight; });
  const rows = animals.map(a=>{
    const ex = animalExitDate(a);
    const after = ex && date > ex;
    const note = after ? (a.status==='مباع' ? `مباع ${ex} — الوزنة دي بعد البيع ومش بتتحسب` : `نافق ${ex} — الوزنة دي بعد النفوق ومش بتتحسب`) : (a.status!=='نشط' ? a.status : '');
    return `<div class="ed-row ${after?'ed-out':''} ${statusRowClass(a)}"><span class="tag">${a.tagNumber}</span><span class="ed-note">${note}</span>
      <input type="number" step="any" inputmode="decimal" class="rd-w" data-aid="${a.id}" value="${edAttr(cur[a.id])}" placeholder="كجم" aria-label="وزن ${edAttr(a.tagNumber)}"></div>`;
  }).join('');
  const box = appModal(`
    <div class="sc-modal-back" data-ed-close></div>
    <div class="sc-modal ed-modal" role="dialog" aria-modal="true" aria-labelledby="rdTitle">
      <h3 id="rdTitle">تعديل جولة الوزن</h3>
      <label class="ed-field">تاريخ الجولة<input type="date" id="rdDate" value="${date}"></label>
      <div class="ed-hint">سيب الخانة فاضية لو الحيوان ما اتوزنش في الجولة دي</div>
      <div class="ed-sum"><span>الموزونين: <b id="rdCnt">0</b></span><span>الإجمالي: <b id="rdSum">0</b> كجم</span></div>
      <div class="ed-list">${rows}</div>
