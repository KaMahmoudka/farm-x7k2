function fmt(n, d=2){
  if(n === null || n === undefined || isNaN(n)) return "-";
  return Number(n).toFixed(d);
}

// مستهلك فعليًا (لحساب FCR) — للمصاريف القديمة اللي متسجلة بحقل "الكمية" القديم بس، بناخده كأنه مستهلك
function consumedQty(e){
  if(e.consumedKg !== undefined && e.consumedKg !== null && e.consumedKg !== ''){
    return parseFloat(e.consumedKg) || 0;
  }
  return parseFloat(e.quantityKg) || 0;
}
// مخزون/مشترى — للمصاريف القديمة اللي معاها حقل "الكمية" القديم بس، بناخده كأنه نفس كمية المخزون كمان
function stockQty(e){
  if(e.stockKg !== undefined && e.stockKg !== null && e.stockKg !== ''){
    return parseFloat(e.stockKg) || 0;
  }
  return parseFloat(e.quantityKg) || 0;
}
// true لو المصروف ده لسه معندوش قيمتين منفصلتين لـ"مخزون" و"مستهلك" — يعني أي رقم ظاهر ليهم حاليًا مجرد افتراض من حقل واحد قديم، مش رقمين حقيقيين اتسجلوا منفصلين
function isLegacyQty(e){
  const noStock = (e.stockKg === undefined || e.stockKg === null || e.stockKg === '');
  const noConsumed = (e.consumedKg === undefined || e.consumedKg === null || e.consumedKg === '');
  return noStock && noConsumed && !!(parseFloat(e.quantityKg) > 0);
}
// تبن الأرز تحديدًا — مستبعد من التحديث الجماعي لأنه غالبًا لسه نسبة كبيرة منه متخزنة مش متاكلة
function isRiceStraw(e){
  return ((e.subType||'').includes('أرز'));
}

function estimateAnimalFeed(an, perfItem){
  const purchaseW = parseFloat(an.purchaseWeight) || 0;
  const lastW = perfItem && perfItem.lastWeight !== null ? perfItem.lastWeight : purchaseW;
  const days = perfItem && perfItem.days ? perfItem.days : (an.purchaseDate ? Math.max(0, daysBetween(an.purchaseDate, new Date().toISOString().slice(0,10))) : 0);
  const avgW = (purchaseW > 0 && lastW > 0) ? (purchaseW + lastW) / 2 : (lastW || purchaseW);
  const row = lookupFeedingProgram(avgW);
  let estConc = null, estFiller = null;
  if(row && days > 0){ estConc = row.conc * days; estFiller = row.filler * days; }
  const feedStats = computeFeedStats();
  let allocatedConc = null;
  if(perfItem && perfItem.gain !== null && perfItem.gain > 0 && feedStats.totalGainKg > 0 && feedStats.totalFeedKg > 0){
    allocatedConc = (perfItem.gain / feedStats.totalGainKg) * feedStats.totalFeedKg;
  }
  return { days, avgW, row, estConc, estFiller, allocatedConc, feedStats };
}

function renderAnimalFile(animalId){
  const an = state.animals.find(a=>a.id===animalId);
  if(!an) return '<div class="card"><div class="empty">الحيوان غير موجود</div></div>';
  const perf = computePerformance().find(p=>p.animal.id===animalId) || null;
  const weights = state.weights.filter(w=>w.animalId===animalId).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  const health = state.healthRecords.filter(h=>h.animalId===animalId).slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  const sale = state.sales.find(s=>s.animalId===animalId);
  const feed = estimateAnimalFeed(an, perf);
  const feedStats = feed.feedStats;
  const latest = getLatestMarketPrice();
  const marketPrice = latest ? parseFloat(latest.pricePerKg) : null;
  const todayStr = new Date().toISOString().slice(0,10);
  const daysInHerd = an.purchaseDate ? daysBetween(an.purchaseDate, (an.status==='نافق' && an.deathDate) ? an.deathDate : (sale ? sale.saleDate : todayStr)) : null;
  const purchasePrice = parseFloat(an.purchasePrice) || 0;
  const gain = perf && perf.gain !== null ? perf.gain : null;
  const lastWeight = perf && perf.lastWeight !== null ? perf.lastWeight : null;
  const allocatedFeedCost = (gain !== null && gain > 0 && feedStats.costPerKgGainFeedOnly !== null) ? feedStats.costPerKgGainFeedOnly * gain : null;
  const allocatedVetCost = (gain !== null && gain > 0 && feedStats.costPerKgGain !== null && feedStats.costPerKgGainFeedOnly !== null)
    ? (feedStats.costPerKgGain - feedStats.costPerKgGainFeedOnly) * gain : null;
  const totalCost = purchasePrice + (allocatedFeedCost||0) + (allocatedVetCost||0);
  const expectedValue = (marketPrice !== null && lastWeight !== null) ? lastWeight * marketPrice : null;
  const profit = (expectedValue !== null) ? expectedValue - totalCost : null;
  const breakEven = computeBreakEven(perf || {gain:null,lastWeight:null,animal:an}, feedStats);

  const weightRows = weights.length ? weights.map((w,i)=>{
    const prev = i>0 ? parseFloat(weights[i-1].weight) : parseFloat(an.purchaseWeight);
    const cur = parseFloat(w.weight);
    const delta = (prev && cur) ? (cur - prev) : null;
    return `<tr><td>${w.date}</td><td>${fmt(cur,1)}</td><td>${delta!==null? (delta>=0?'+':'')+fmt(delta,1) : '-'}</td></tr>`;
  }).join('') : '<tr><td colspan="3" class="text">لا توجد أوزان مسجلة</td></tr>';

  const healthRows = health.length ? health.map(h=>{
    let due = '-';
    if(h.nextDueDate){
      const d = daysBetween(todayStr, h.nextDueDate);
      due = d<0 ? `${h.nextDueDate} (متأخر)` : (d<=7 ? `${h.nextDueDate} (قريبًا)` : h.nextDueDate);
    }
    return `<tr><td class="text">${h.type}</td><td>${h.date}</td><td class="text">${due}</td><td class="text">${h.note||'-'}</td></tr>`;
  }).join('') : '<tr><td colspan="4" class="text">لا توجد سجلات صحية</td></tr>';

  const statusCls = an.status==='نشط' ? 'excellent' : (an.status==='نافق' ? 'dead' : 'sold');
  const kv = (label, val, cls) => `<div class="af-kv ${cls||''}"><div class="k">${label}</div><div class="v">${val}</div></div>`;
  const exitCls = an.status==='مباع' ? 'af-sold' : (an.status==='نافق' ? 'af-dead' : '');
  const exitBanner = an.status==='مباع'

    : (an.status==='نافق' ? `<div class="af-banner dead">${an.deathDate ? '' : `<button class="btn danger small" type="button" data-edit-animal-modal="${an.id}" style="margin-inline-end:8px">حدد تاريخ النفوق</button>`}نافق — تاريخ النفوق: <b>${an.deathDate || 'مش متسجل'}</b>${an.deathCause ? ` — السبب: ${an.deathCause}` : ''} — خارج حسابات القطيع من التاريخ ده</div>` : '');

          ${kv('أيام في المزرعة', daysInHerd!==null? daysInHerd : '-')}
          ${kv('المورد', an.supplier||'-')}
          ${kv('العنبر', an.pen||'-')}
          ${kv('سعر الشراء (جنيه)', fmt(purchasePrice,0))}
          ${kv('وزن الشراء (كجم)', fmt(parseFloat(an.purchaseWeight),1))}
          ${sale ? kv('بيع فعلي', sale.saleDate+' · '+fmt(parseFloat(sale.salePrice),0)) : ''}
          ${an.status==='نافق' ? kv('النفوق', (an.deathDate||'-')+(an.deathCause? ' · '+an.deathCause : ''), 'bad') : ''}
        </div>
      </section>
      <section class="af-sec">
        <h3>الأداء <span class="i18n-en">Performance</span></h3>
        <div class="af-grid">
          ${kv('آخر وزن (كجم)', lastWeight!==null? fmt(lastWeight,1) : '-')}
          ${kv('الزيادة الكلية (كجم)', gain!==null? fmt(gain,1) : '-')}
          ${kv('معدل يومي (كجم/يوم)', perf && perf.rate!==null? fmt(perf.rate,3) : '-')}
          ${kv('التصنيف', perf && perf.classification? perf.classification : '-')}
        </div>
      </section>
      <section class="af-sec">
        <h3>لو بعته النهاردة <span class="i18n-en">If sold today</span></h3>
        <div class="af-grid">
          ${kv('سعر السوق / كجم', marketPrice!==null? fmt(marketPrice,0) : '-')}
          ${kv('القيمة المتوقعة', expectedValue!==null? fmt(expectedValue,0) : '-')}
          ${kv('تكلفة الشراء', fmt(purchasePrice,0))}
          ${kv('نصيب العلف', allocatedFeedCost!==null? fmt(allocatedFeedCost,0) : '-')}
          ${kv('نصيب الرعاية البيطرية', allocatedVetCost!==null? fmt(allocatedVetCost,0) : '-')}
          ${kv('الربح / الخسارة المتوقع', profit!==null? (profit>=0?'+':'')+fmt(profit,0) : '-', profit!==null && profit<0 ? 'bad' : '')}
          ${kv('سعر التعادل للكيلو', breakEven!==null? fmt(breakEven,1) : '-')}
        </div>
      </section>
      <section class="af-sec">
        <h3>تقدير العلف <span class="i18n-en">Feed Estimate</span></h3>
        <div class="af-grid">
          ${kv('المرحلة', feed.row? feed.row.phase : '-')}
          ${kv('عليقة يومية (كجم)', feed.row? fmt(feed.row.total,2) : '-')}
          ${kv('تقدير مركز (كجم)', feed.estConc!==null? fmt(feed.estConc,0) : '-')}
          ${kv('تقدير مالئ (كجم)', feed.estFiller!==null? fmt(feed.estFiller,0) : '-')}
          ${kv('نصيب من المركز المستهلك (كجم)', feed.allocatedConc!==null? fmt(feed.allocatedConc,0) : '-')}
        </div>
      </section>
    </div>
    <div class="af-sections af-tables">
      <section class="af-sec">
        <h3>سجل الأوزان (${weights.length}) <span class="i18n-en">Weights</span></h3>
        <div class="table-scroll"><table>
          <tr><th>التاريخ</th><th>الوزن</th><th>الزيادة</th></tr>
          ${weightRows}
        </table></div>
      </section>
      <section class="af-sec">
        <h3>السجل الصحي (${health.length}) <span class="i18n-en">Health</span></h3>
        <div class="table-scroll"><table>
          <tr><th>النوع</th><th>التاريخ</th><th>الموعد القادم</th><th>ملاحظات</th></tr>
          ${healthRows}
        </table></div>
      </section>
    </div>
  </div>`;
}

// قايمة اختيار النوع الفرعي (بدل خانة الكتابة) — بتشتغل صح على الموبايل، وبتضمن إن الاسم مطابق بالظبط لحساب FCR وتكلفة العلف
function subtypeOptionsHtml(cat, value){
  const list = EXPENSE_SUBTYPES[cat] || [];
  const v = (value||'').trim();
  const isOther = v !== '' && !list.includes(v);
  return `<option value="">${cat==='علف' ? '— اختر نوع العلف —' : '— بدون —'}</option>` +
    list.map(t=>`<option value="${t}" ${t===v?'selected':''}>${t}</option>`).join('') +
    `<option value="__other__" ${isOther?'selected':''}>أخرى (اكتب)…</option>`;
}
function readSubtype(selEl, customEl){
  if(!selEl) return '';
  return selEl.value === '__other__' ? ((customEl && customEl.value) || '').trim() : selEl.value;
}

function render(){
  renderTabs();
  renderBackupBanner();
  const c = document.getElementById('content');
  if(!loaded){ c.innerHTML = '<div class="empty">جاري التحميل...</div>'; return; }
  if(activeTab === "dashboard") c.innerHTML = renderDashboard();
  if(activeTab === "feasibility") c.innerHTML = renderFeasibility();
  if(activeTab === "animals") c.innerHTML = renderAnimals();
  if(activeTab === "weights") c.innerHTML = renderWeights();
  if(activeTab === "performance") c.innerHTML = renderPerformance();
  if(activeTab === "feeding") c.innerHTML = renderFeedingProgram();
  if(activeTab === "health") c.innerHTML = renderHealth();
  if(activeTab === "expenses") c.innerHTML = renderExpenses();
  if(activeTab === "sales") c.innerHTML = renderSales();
  if(activeTab === "guide") c.innerHTML = renderGuide();
  if(activeTab === "scale") c.innerHTML = renderScale();
  if(selectedAnimalId && !state.animals.some(a=>a.id===selectedAnimalId)) selectedAnimalId = null;
  if(activeTab === "animals" && selectedAnimalId){
    c.innerHTML = renderAnimalFile(selectedAnimalId) + ((window.innerWidth > 1180) ? renderAnimals() : '');
  }
  decorateExitedAnimals(c);
  attachHandlers();
  if(!window._firstEnter){ window._firstEnter = true; flashEnter(); }
}

function renderBackupBanner(){
  const el = document.getElementById('backupBanner');
  if(!el) return;
  if(!loaded){ el.innerHTML = ''; return; }
  const last = state.meta && state.meta.lastBackupAt;
  const days = last ? daysBetween(last, new Date().toISOString()) : null;
  if(days === null || days > BACKUP_REMINDER_DAYS){
    const msg = last ? `آخر نسخة احتياطية من ${days} يوم` : 'لسه ما عملتش نسخة احتياطية لبياناتك';
    el.innerHTML = `<div class="backup-banner">
      <span>⚠️ ${msg} — البيانات محفوظة على هذا الجهاز بس، ولو اتمسحت بيانات المتصفح أو اتغير الجهاز هتضيع نهائيًا.</span>
      <button class="btn small" id="quickBackupBtn" type="button">تصدير نسخة احتياطية الآن</button>
    </div>`;
  } else {
    el.innerHTML = '';
  }
}

function renderDashboard(){
  const perf = computePerformance();
  const total = state.animals.length;
  const active = state.animals.filter(a=>a.status==="نشط").length;
  const soldCount = state.animals.filter(a=>a.status==="مباع").length;
  const rates = perf.filter(p=>isActiveAnimal(p.animal) && p.rate!==null).map(p=>p.rate);
  const avgRate = rates.length ? rates.reduce((a,b)=>a+b,0)/rates.length : null;
  const warnCount = perf.filter(p=>isActiveAnimal(p.animal) && (p.classification==="تحذير" || p.alert)).length;
  const totalPurchase = state.animals.reduce((s,a)=> s + (parseFloat(a.purchasePrice)||0), 0);

  const byType = {};
  ANIMAL_TYPES.forEach(t => byType[t] = {count:0, sum:0});
  perf.filter(p=>isActiveAnimal(p.animal)).forEach(p=>{
    const t = p.animal.type;
    if(!byType[t]) byType[t] = {count:0, sum:0};
    byType[t].count++;
    if(p.rate !== null) byType[t].sum += p.rate;
  });

  const maxAvg = Math.max(0.01, ...Object.values(byType).map(v=> v.count ? v.sum/v.count : 0));
  const fin = computeFinancials();
  const feedStats = computeFeedStats();
  const mortality = computeMortality();
  const sellToday = computeHerdSellTodayScenario();
  const todayStr = new Date().toISOString().slice(0,10);
  const upcomingHealth = computeUpcomingHealth();
  const herd = computeHerdWeightStats();
  const weighingRounds = computeHerdWeighingRounds();
  const daysSinceStart = (weighingRounds.length>0 && weighingRounds[0].date) ? daysBetween(weighingRounds[0].date, new Date().toISOString().slice(0,10)) : null;
  const roundsInsights = computeRoundsInsights(weighingRounds);
  const trendByDate = {};
  if(roundsInsights){
    roundsInsights.withTrend.forEach(r=>{ if(r.date) trendByDate[r.date] = r.trend; });
  }
  const TREND_ICON = { up: '↑', down: '↓', flat: '→' };
  const TREND_COLOR = { up: 'var(--sage)', down: 'var(--barn-red)', flat: 'var(--ink-soft)' };
  const TREND_LABEL = { up: 'تحسّن عن الجولة اللي فاتت', down: 'تراجع عن الجولة اللي فاتت', flat: 'شبه ثابت عن الجولة اللي فاتت' };

  const weighingRoundsRows = weighingRounds.length===0 ? '' : weighingRounds.map(r=>{
    const dateLabel = r.isStart ? (`البداية${r.date? ' ('+r.date+')' : ''}`) : r.date;
    const deltaCell = r.delta!==null ? `<span class="${r.delta<0?'warn':''}">${r.delta>=0?'+':''}${fmt(r.delta,0)}</span>` : '-';
    const cumCell = r.cumulative!==null ? `${r.cumulative>=0?'+':''}${fmt(r.cumulative,0)}` : '-';
    const feedInputCell = (r.delta!==null && r.date) ? `<input type="number" step="any" class="period-feed-input" data-round-date="${r.date}" value="${r.periodFeedManual!==null? r.periodFeedManual : ''}" placeholder="${r.periodFeedAuto>0? 'تقدير: '+fmt(r.periodFeedAuto,0)+' كجم' : 'كجم'}">` : '-';
    const trend = r.date ? trendByDate[r.date] : null;
    const trendCell = trend ? `<span style="color:${TREND_COLOR[trend]};font-weight:800" title="${TREND_LABEL[trend]}">${TREND_ICON[trend]}</span>` : '-';
    return `<tr>
      <td class="text">${dateLabel}</td>
      <td>${r.count!==null? r.count : '-'}</td>
      <td>${fmt(r.total,0)}</td>
      <td>${deltaCell}</td>
      <td>${cumCell}</td>
      <td>${r.days!==null? r.days : '-'}</td>
      <td>${r.ratePerDay!==null? fmt(r.ratePerDay,1):'-'}</td>
      <td>${r.perAnimalRate!==null? fmt(r.perAnimalRate,3):'-'}</td>
      <td>${trendCell}</td>
      <td class="text">${feedInputCell}</td>
      <td>${r.periodFCR!==null? fmt(r.periodFCR,2):'-'}</td>

      <td><button class="ic-btn round-edit-btn" type="button" data-edit-round="${r.isStart ? '__start' : r.date}" aria-label="تعديل الجولة" title="تعديل الجولة">${ic('edit')}</button></td>
    </tr>`;
  }).join('');

  const nextRoundDaysOverride = parseFloat(state.config.nextRoundDaysOverride) || null;
  const nextRoundForecast = computeNextRoundForecast(weighingRounds, nextRoundDaysOverride);

  const alerts = computeActionCenterAlerts();
  const staleRows = alerts.staleAnimals.map(x=>`<tr>
      <td class="text"><span class="tag">${x.animal.tagNumber}</span></td>
      <td class="text">${x.neverWeighed? 'من تاريخ الشراء' : 'آخر وزنة'}: ${x.refDate}</td>
      <td class="${x.daysSince>=alerts.staleDaysThreshold*1.5?'warn':''}">${x.daysSince}</td>
    </tr>`).join('');
  const rampupRows2 = alerts.rampupEnding.map(x=>`<tr>
      <td class="text"><span class="tag">${x.animal.tagNumber}</span></td>
      <td class="text">${x.animal.purchaseDate}</td>
      <td>${x.daysSince} / ${FEED_RAMPUP.durationDays}</td>
      <td class="${x.daysLeft<=3?'warn':''}">${x.daysLeft}</td>

  const nearTargetRows = alerts.nearTarget.map(r=>`<tr>
      <td class="text"><span class="tag">${r.animal.tagNumber}</span></td>
      <td>${fmt(r.w0,1)}</td>

        <div><span>إجمالي مصاريف العلف (جنيه)</span><b>${g0(fin.totalFeed)}</b></div>
        <div><span>إجمالي المصاريف البيطرية (جنيه)</span><b>${g0(fin.totalVet)}</b></div>
        <div class="${mortality.lossValue>0?'warn':''}"><span>خسائر النفوق التقديرية (جنيه)</span><b>${g0(mortality.lossValue)}</b></div>

    </section>
    <div class="stat st-total"><div class="num">${total}</div><div class="label">إجمالي عدد الحيوانات المسجلة</div></div>

    <h2 style="margin-top:0">لو بعت القطيع النشط كله النهاردة؟ <span class="i18n-en">Sell Active Herd Today?</span></h2>

      <div class="stat"><div class="num">${sellToday.price!==null? fmt(sellToday.price,0)+' جنيه':'-'}</div><div class="label">سعر الكيلو الحي المسجل${sellToday.priceDate? ' — '+sellToday.priceDate : ''}</div></div>

      ${weighingRoundsRows}

// أي مكان فيه رقم حيوان مباع أو نافق (في أي جدول أو قايمة) بيتلوّن هو والصف بتاعه
function decorateExitedAnimals(root){
  if(!root) return;
  const byTag = {};
  state.animals.forEach(a=>{ if(a.status==='مباع' || a.status==='نافق') byTag[String(a.tagNumber).trim()] = a.status; });
  if(!Object.keys(byTag).length) return;
  root.querySelectorAll('.tag').forEach(t=>{
    const st = byTag[(t.textContent||'').trim()];
    if(!st) return;
    const cls = st==='مباع' ? 'sold' : 'dead';
    t.classList.add('tag-'+cls);
    const tr = t.closest('tr'); if(tr && !tr.classList.contains('editing-row')) tr.classList.add('row-'+cls);
  });
}
function statusRowClass(an){ return !an ? '' : (an.status==='مباع' ? 'row-sold' : (an.status==='نافق' ? 'row-dead' : '')); }
function statusBadge(an){
  const ex = animalExitDate(an);
  if(an.status==='مباع') return `<span class="badge sold">مباع${ex? ' · '+ex : ''}</span>`;
  if(an.status==='نافق') return `<span class="badge dead">نافق${ex? ' · '+ex : ''}</span>`;
  return `<span class="badge excellent">${an.status}</span>`;
}

function renderAnimals(){
  const q = (searchQuery||'').toLowerCase();
  let list = state.animals.filter(a=>{
    if(q && !((a.tagNumber||'').toLowerCase().includes(q) || (a.type||'').toLowerCase().includes(q) || (a.pen||'').toLowerCase().includes(q) || (a.supplier||'').toLowerCase().includes(q))) return false;
    if(animalFilter.type && a.type !== animalFilter.type) return false;
    if(animalFilter.status && a.status !== animalFilter.status) return false;
    return true;
  });
  if(animalFilter.sort === 'tag') list = list.slice().sort((x,y)=> String(x.tagNumber).localeCompare(String(y.tagNumber), 'ar', {numeric:true}));
  else if(animalFilter.sort === 'date') list = list.slice().sort((x,y)=> new Date(y.purchaseDate||0) - new Date(x.purchaseDate||0));
  else if(animalFilter.sort === 'weight') list = list.slice().sort((x,y)=> (parseFloat(y.purchaseWeight)||0) - (parseFloat(x.purchaseWeight)||0));
  else list = list.slice().reverse();
  const perfById = {};
  computePerformance().forEach(p=>{ perfById[p.animal.id] = p; });
  const cards = list.map(a=>{
    const p = perfById[a.id];
    const st = a.status==='نشط' ? '' : (a.status==='مباع' ? 'st-sold' : 'st-dead');
    const bcls = a.status==='نشط' ? 'excellent' : (a.status==='نافق' ? 'dead' : 'sold');
    const lw = p && p.lastWeight!==null ? fmt(p.lastWeight,0) : null;
    const rate = p && p.rate!==null ? fmt(p.rate,2) : null;
    const dd = a.purchaseDate ? daysBetween(a.purchaseDate, animalExitDate(a) || new Date().toISOString().slice(0,10)) : null;
    return `<div class="animal-card ${st} ${a.id===selectedAnimalId?'sel':''}" data-view-animal="${a.id}">
      <div class="ac-main">
        <div class="ac-top"><span class="tag">${a.tagNumber}</span><span class="badge ${bcls}">${a.status}</span></div>
        <div class="ac-sub">${a.type}${a.pen? ' · عنبر '+a.pen : ''}${a.supplier? ' · '+a.supplier : ''}</div>
        <div class="ac-chips">
          <span class="chip green">⚖ ${lw!==null? lw : fmt(parseFloat(a.purchaseWeight),0)} كجم</span>
          ${rate!==null? `<span class="chip">↗ ${rate} كجم/يوم</span>` : ''}
          ${dd!==null? `<span class="chip amber">📅 ${dd} يوم</span>` : ''}
        </div>
      </div>
      <div class="ac-actions">
        <button class="ic-btn" type="button" data-edit-animal-modal="${a.id}" aria-label="تعديل">${ic('edit')}</button>
        <button class="ic-btn danger" type="button" data-del-animal="${a.id}" aria-label="حذف">${ic('trash')}</button>
      </div>
    </div>`;
  }).join('');
  const rows = list.map(a => {
    if(editingAnimalId === a.id){
      return `<tr class="editing-row">
        <td class="text"><input class="edit-animal-tag" value="${a.tagNumber}"></td>
        <td class="text"><select class="edit-animal-type">${ANIMAL_TYPES.map(t=>`<option ${t===a.type?'selected':''}>${t}</option>`).join('')}</select></td>
        <td><input type="date" class="edit-animal-purchaseDate" value="${a.purchaseDate||''}"></td>
        <td class="text"><input class="edit-animal-supplier" value="${a.supplier||''}"></td>
        <td><input type="number" step="any" class="edit-animal-purchasePrice" value="${a.purchasePrice||''}"></td>
        <td><input type="number" step="any" class="edit-animal-purchaseWeight" value="${a.purchaseWeight||''}"></td>
        <td>-</td>
        <td class="text"><input class="edit-animal-pen" value="${a.pen||''}"></td>
        <td class="text">
          <select class="edit-animal-status"><option ${a.status==="نشط"?'selected':''}>نشط</option><option ${a.status==="مباع"?'selected':''}>مباع</option><option ${a.status==="نافق"?'selected':''}>نافق</option></select>
          <div class="death-fields" style="display:${a.status==="نافق"?'flex':'none'}">
            <input type="date" class="edit-animal-deathDate" value="${a.deathDate||''}" placeholder="تاريخ النفوق">
            <input type="text" class="edit-animal-deathCause" value="${a.deathCause||''}" placeholder="السبب (اختياري)">
          </div>
        </td>
        <td>
          <button class="btn small" data-save-animal="${a.id}">حفظ</button>
          <button class="btn secondary small" data-cancel-animal="${a.id}">إلغاء</button>
        </td>
      </tr>`;
    }
    const pw = parseFloat(a.purchaseWeight), pp = parseFloat(a.purchasePrice);
    const perKg = (pw>0) ? (pp/pw) : null;
    return `<tr class="${a.id===selectedAnimalId?'sel':''} ${statusRowClass(a)}">

function renderPerformance(){
  const perf = computePerformance();
  const feedStats = computeFeedStats();
  const rows = perf.map(p => {
    const rowClass = p.alert ? 'alert-row' : '';
    const breakEven = computeBreakEven(p, feedStats);
    const feedRow = p.lastWeight!==null ? lookupFeedingProgram(p.lastWeight) : null;
    const expectedRate = null;
    return `<tr class="${rowClass} ${statusRowClass(p.animal)}">
      <td class="text"><span class="tag">${p.animal.tagNumber}</span></td>
      <td class="text">${p.animal.type}</td>
      <td>${fmt(p.animal.purchaseWeight,1)}</td>
      <td>${p.animal.purchaseDate}</td>
      <td>${p.lastWeight!==null? fmt(p.lastWeight,1):'-'}</td>
      <td>${p.lastDate || '-'}</td>
      <td>${p.days!==null? p.days:'-'}</td>
      <td>${p.gain!==null? fmt(p.gain,1):'-'}</td>
      <td>${p.rate!==null? fmt(p.rate,3):'-'}</td>
      <td class="text">${feedRow? `${feedRow.phase} — ${fmt(feedRow.total,2)} كجم/يوم` :'-'}</td>
      <td>${p.classification? `<span class="badge ${badgeClass(p.classification)}">${p.classification}</span>` : '-'}</td>
      <td>${breakEven!==null? fmt(breakEven,0):'-'}</td>
      <td class="text">${p.alert? `<span class="badge warn">${p.alert}</span>` : '—'}</td>
    </tr>`;
  }).join('');

  const activePerf = perf.filter(p=>isActiveAnimal(p.animal));
  const bySupplier = computeGroupStats(activePerf, a=>a.supplier);
  const byPen = computeGroupStats(activePerf, a=>a.pen);
  const groupRows = (groups)=> groups.map(g=>`<tr>
      <td class="text">${g.key}</td>
      <td>${g.count}</td>
      <td>${g.avgRate!==null? fmt(g.avgRate,3):'-'}</td>
    </tr>`).join('');

  // ---- سعر السوق وتقرير الربحية وقرار البيع ----
  const todayStr = new Date().toISOString().slice(0,10);
  const latestPriceEntry = getLatestMarketPrice();
  const marketPrice = latestPriceEntry ? parseFloat(latestPriceEntry.pricePerKg) : null;
  const activeBreakEvens = perf.filter(p=>p.animal.status==="نشط").map(p=>computeBreakEven(p, feedStats)).filter(v=>v!==null);
  const avgBreakEven = activeBreakEvens.length ? activeBreakEvens.reduce((a,b)=>a+b,0)/activeBreakEvens.length : null;
  const priceGap = (marketPrice!==null && avgBreakEven!==null) ? (marketPrice - avgBreakEven) : null;
  const recentPrices = (state.marketPrices||[]).slice().sort((a,b)=> new Date(b.date)-new Date(a.date) || (b.id>a.id?1:-1)).slice(0,6);
  const recentPricesRows = recentPrices.map(mp=>`<tr>
      <td>${mp.date}</td>
      <td>${fmt(mp.pricePerKg,0)}</td>
      <td><button class="btn danger small" data-del-marketprice="${mp.id}">حذف</button></td>
    </tr>`).join('');

  const profitList = computeProfitability(perf, feedStats, marketPrice);
  const profitRows = profitList.map(pr=>{
    let decisionCell = '-';
    if(pr.marginalPerKg !== null){
      decisionCell = pr.marginalPerKg > 0
        ? `<span class="badge excellent">استمر في التسمين ✅ (+${fmt(pr.marginalPerKg,0)} جنيه/كجم)</span>`
        : `<span class="badge warn">قرّب موعد البيع ⚠️ (${fmt(pr.marginalPerKg,0)} جنيه/كجم)</span>`;
    }
    return `<tr>
      <td class="text"><span class="tag">${pr.animal.tagNumber}</span></td>
      <td>${fmt(pr.lastWeight,1)}</td>
      <td>${fmt(pr.totalCost,0)}</td>
      <td>${pr.expectedValue!==null? fmt(pr.expectedValue,0):'-'}</td>
      <td class="${pr.profit!==null && pr.profit<0?'warn':''}">${pr.profit!==null? (pr.profit>=0?'+':'')+fmt(pr.profit,0):'-'}</td>
      <td class="text">${decisionCell}</td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <h2>سعر السوق الحالي <span class="i18n-en">Current Market Price</span> (سعر الكيلو الحي)</h2>
    <div class="stat-grid">
      <div class="stat"><div class="num">${marketPrice!==null? fmt(marketPrice,0)+' جنيه':'-'}</div><div class="label">آخر سعر مسجل${latestPriceEntry? ' — '+latestPriceEntry.date : ''}</div></div>
      <div class="stat"><div class="num">${avgBreakEven!==null? fmt(avgBreakEven,0)+' جنيه':'-'}</div><div class="label">متوسط سعر التعادل الحالي للقطيع النشط</div></div>
      <div class="stat ${priceGap!==null && priceGap<0? 'warn':''}"><div class="num">${priceGap!==null? (priceGap>=0?'+':'')+fmt(priceGap,0)+' جنيه':'-'}</div><div class="label">الفارق (سعر السوق − متوسط التعادل)</div></div>
    </div>
    <form id="marketPriceForm" class="form-grid" style="margin-top:10px">
      <div><label>التاريخ</label><input required type="date" name="date" value="${todayStr}"></div>
      <div><label>سعر الكيلو الحي (جنيه)</label><input required type="number" step="any" name="pricePerKg" placeholder="مثلاً: 95"></div>
      <div style="align-self:flex-end"><button class="btn" type="submit">تسجيل السعر</button></div>
    </form>
    ${recentPricesRows? `<div class="table-scroll" style="margin-top:10px"><table>
      <tr><th>التاريخ</th><th>السعر (جنيه/كجم)</th><th></th></tr>
      ${recentPricesRows}
    </table></div>` : ''}
  </div>
  <div class="threshold-box">
    <label style="margin:0">الحد الأدنى لمعدل الزيادة اليومي المقبول (كجم/يوم):</label>
    <input type="number" step="0.01" id="thresholdInput" value="${state.config.threshold}">
    <span style="color:var(--ink-soft)">غيّرها حسب نوع الحيوان والموسم</span>
  </div>
  <div class="card">
    <h2>تحليل الأداء <span class="i18n-en">Performance Analysis</span> (${state.animals.length})</h2>
    <div class="legend">
      <span><span class="dot" style="background:var(--sage)"></span>ممتاز</span>
      <span><span class="dot" style="background:#4A76B0"></span>جيد</span>
      <span><span class="dot" style="background:#8A99AB"></span>ضعيف</span>
      <span><span class="dot" style="background:var(--barn-red)"></span>تحذير / تنبيه</span>
    </div>
    <br>
    ${state.animals.length===0? `<div class="empty">أضف حيوانات وأوزان أولاً ليظهر التحليل</div>` : `
    <div class="table-scroll"><table>
      <tr><th>رقم الحيوان</th><th>النوع</th><th>وزن الشراء</th><th>تاريخ الشراء</th><th>آخر وزن</th><th>تاريخ آخر وزن</th><th>عدد الأيام</th><th>الزيادة (كجم)</th><th>معدل يومي فعلي</th><th>المرحلة والعليقة اليومية (برنامج التغذية)</th><th>التصنيف</th><th>سعر التعادل (جنيه/كجم)</th><th>ملاحظات</th></tr>
      ${rows}
    </table></div>`}
  </div>
  ${state.animals.length>0? `
  <div class="card">
    <h2>مقارنة حسب المورد <span class="i18n-en">Comparison by Supplier</span></h2>
    <div class="table-scroll"><table>
      <tr><th>المورد</th><th>عدد الحيوانات</th><th>متوسط المعدل اليومي (كجم)</th></tr>
      ${groupRows(bySupplier)}
    </table></div>
  </div>
  <div class="card">
    <h2>مقارنة حسب العنبر <span class="i18n-en">Comparison by Pen</span></h2>
    <div class="table-scroll"><table>
      <tr><th>العنبر</th><th>عدد الحيوانات</th><th>متوسط المعدل اليومي (كجم)</th></tr>
      ${groupRows(byPen)}
    </table></div>
  </div>
  <div class="card">
    <h2>تقرير الربحية المتوقعة وقرار البيع <span class="i18n-en">Profitability &amp; Sell Decision</span> (الحيوانات النشطة فقط)</h2>
    ${marketPrice===null? `<div class="empty">سجّل سعر السوق الحالي فوق الأول عشان يظهر تقرير الربحية والقرار</div>` : (profitList.length===0? `<div class="empty">محتاج آخر وزن مسجل لكل حيوان عشان يظهر في التقرير</div>` : `
    <div class="table-scroll"><table>
      <tr><th>رقم الحيوان</th><th>آخر وزن (كجم)</th><th>التكلفة الإجمالية (شراء + علف + بيطري)</th><th>القيمة المتوقعة (بسعر السوق)</th><th>هامش الربح المتوقع</th><th>القرار</th></tr>
      ${profitRows}
    </table></div>`)}
  </div>` : ''}`;
}

function renderSales(){
  const activeAnimals = state.animals.filter(a=> !state.sales.some(s=>s.animalId===a.id));
  const animalOptions = activeAnimals.map(a=>`<option value="${a.id}">${a.tagNumber} — ${a.type}</option>`).join('');

  const perf = computePerformance();
  const feedStats = computeFeedStats();
  const rows = state.sales.slice().sort((a,b)=> new Date(b.saleDate)-new Date(a.saleDate)).map(s=>{
    const an = state.animals.find(a=>a.id===s.animalId);
    const margin = parseFloat(s.salePrice) - (an? parseFloat(an.purchasePrice)||0 : 0);

    const p = an ? perf.find(x=>x.animal.id===an.id) : null;
    const gain = (p && p.gain!==null && p.gain>0) ? p.gain : 0;
    const hasAllocation = p && p.gain!==null && p.gain>0 && feedStats.costPerKgGain!==null;
    const allocatedCost = hasAllocation ? (feedStats.costPerKgGain * gain) : null;
    const netProfit = hasAllocation ? (margin - allocatedCost) : null;

    return `<tr>
      <td class="text"><span class="tag">${an? an.tagNumber:'؟'}</span></td>
      <td class="text">${an? an.type:'-'}</td>
      <td>${an? fmt(an.purchasePrice,0):'-'}</td>
      <td>${fmt(s.salePrice,0)}</td>
      <td style="color:${margin>=0?'var(--sage)':'var(--barn-red)'}">${fmt(margin,0)}</td>
      <td>${allocatedCost!==null? fmt(allocatedCost,0):'-'}</td>
      <td style="color:${netProfit===null?'inherit':(netProfit>=0?'var(--sage)':'var(--barn-red)')}">${netProfit!==null? fmt(netProfit,0):'-'}</td>
      <td>${s.saleDate}</td>
      <td><button class="btn danger small" data-del-sale="${s.id}">حذف</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <h2>تسجيل عملية بيع <span class="i18n-en">Record a Sale</span></h2>
    ${activeAnimals.length===0? `<div class="empty">لا يوجد حيوانات متاحة للبيع حاليًا (كل الحيوانات إما مباعة أو غير مسجلة)</div>`: `
    <form id="saleForm">
      <div class="form-grid">
        <div><label>رقم الحيوان</label><select name="animalId" required>${animalOptions}</select></div>
        <div><label>تاريخ البيع</label><input required type="date" name="saleDate"></div>
        <div><label>سعر البيع (جنيه)</label><input required type="number" step="any" name="salePrice"></div>
      </div>
      <button class="btn" type="submit">تسجيل البيع (وتحديث الحالة إلى مباع)</button>
    </form>`}
  </div>
  <div class="card">
    <h2>سجل المبيعات <span class="i18n-en">Sales Log</span> (${state.sales.length})</h2>
    ${state.sales.length===0? `<div class="empty"><div class="big">💰</div>لسه معندكش عمليات بيع مسجلة</div>` : `
    <div class="table-scroll"><table>
      <tr><th>رقم الحيوان</th><th>النوع</th><th>سعر الشراء</th><th>سعر البيع</th><th>هامش البيع (بيع − شراء)</th><th>تكلفة علف+رعاية مخصصة</th><th>صافي الربح الحقيقي</th><th>تاريخ البيع</th><th></th></tr>
      ${rows}
    </table></div>`}
  </div>`;
}

function renderExpenses(){
  const CATS = ["علف","أدوية بيطرية","زيارة طبيب بيطري","أخرى"];

  const rows = state.expenses.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).map(e=>{
    const hasQty = e.category==="علف" && (e.consumedKg!==undefined || e.quantityKg);
    const updatedNote = e.updatedAt ? `<div style="font-size:10px;color:var(--ink-soft)">آخر تحديث: ${e.updatedAt}</div>` : '';

    if(editingExpenseId === e.id){
      return `<tr class="editing-row">
        <td class="text">${e.category}</td>
        <td><select class="edit-expense-subtype-sel">${subtypeOptionsHtml(e.category, e.subType)}</select><input type="text" class="edit-expense-subtype-custom" value="${(e.subType && !(EXPENSE_SUBTYPES[e.category]||[]).includes(e.subType.trim())) ? e.subType : ''}" placeholder="اكتب النوع" style="margin-top:4px;${(e.subType && !(EXPENSE_SUBTYPES[e.category]||[]).includes(e.subType.trim())) ? '' : 'display:none'}"></td>
        <td><input type="number" step="any" class="edit-expense-consumed" value="${e.consumedKg!==undefined && e.consumedKg!==''? e.consumedKg : (e.quantityKg||'')}" placeholder="مستهلك" style="width:70px"></td>
        <td><input type="text" class="edit-expense-description" value="${e.description||''}"></td>
        <td><input type="number" step="any" class="edit-expense-amount" value="${e.amount}" style="width:70px"></td>
        <td><input type="date" class="edit-expense-date" value="${e.date}"></td>
        <td>
          <button class="btn small" data-save-expense="${e.id}">حفظ</button>
          <button class="btn secondary small" data-cancel-expense="${e.id}">إلغاء</button>
        </td>
      </tr>`;
    }

    return `<tr>
      <td class="text">${e.category}</td>
      <td class="text">${e.subType || '-'}</td>
      <td>${hasQty? fmt(consumedQty(e),1):'-'}</td>
      <td class="text">${e.description || '-'}${updatedNote}</td>
      <td>${fmt(e.amount,0)}</td>
      <td>${e.date}</td>
      <td>
        <button class="btn secondary small" data-edit-expense="${e.id}">تعديل</button>
        <button class="btn danger small" data-del-expense="${e.id}">حذف</button>
      </td>
    </tr>`;
  }).join('');

  const totalFeed = state.expenses.filter(e=>e.category==="علف").reduce((s,e)=> s+(parseFloat(e.amount)||0), 0);
  const totalVet = state.expenses.filter(e=>e.category!=="علف").reduce((s,e)=> s+(parseFloat(e.amount)||0), 0);

  const breakdown = computeFeedBreakdown();
  const breakdownRows = breakdown.rows.map(r=>`<tr>
      <td class="text">${r.subType}</td>
      <td>${r.count}</td>
      <td>${fmt(r.consumed,1)}</td>
      <td>${fmt(r.cost,0)}</td>
    </tr>`).join('');

  return `

function renderFeedingProgram(){
  const toneOf = ph => (FEEDING_PROGRAM.phases.find(p=>p.key===ph)||{}).tone || 'found';
  const rows = FEEDING_PROGRAM.phases.map(ph=>{
    const list = FEEDING_PROGRAM.rows.filter(r=>r.phase===ph.key);
    return `<tr class="fp-phase fp-${ph.tone}"><td colspan="6">${ph.key}</td></tr>` + list.map(r=>`<tr class="fp-row fp-${ph.tone}">
      <td class="fp-w">${r.bw}</td>
      <td>${fmt(r.conc,2)}</td>
      <td>${fmt(r.straw,2)}</td>
      <td>${fmt(r.hay,2)}</td>
      <td>${fmt(r.bran,2)}</td>
      <td>${r.molassesG}</td>
    </tr>`).join('');
  }).join('');

  const perf = computePerformance();
  const activeAnimals = perf.filter(p=>p.animal.status==="نشط");
  const animalRows = activeAnimals.map(p=>{
    const w = p.lastWeight!==null? p.lastWeight : parseFloat(p.animal.purchaseWeight);
    const row = (w && w>0) ? lookupFeedingProgram(w) : null;
    const actualG = p.rate!==null ? Math.round(p.rate*1000) : null;
    return `<tr>
      <td class="text"><span class="tag">${p.animal.tagNumber}</span></td>
      <td>${w? fmt(w,1):'-'}</td>
      <td class="text">${row? row.phase : '-'}</td>
      <td>${row? fmt(row.conc,2):'-'}</td>
      <td>${row? fmt(row.straw,2):'-'}</td>
      <td>${row? fmt(row.hay,2):'-'}</td>
      <td>${row? fmt(row.bran,2):'-'}</td>
      <td>${row? row.molassesG:'-'}</td>
      <td>${actualG!==null? actualG:'-'}</td>
    </tr>`;
  }).join('');

  const rampupRows = FEED_RAMPUP.rows.map(r=>`<tr>
    <td>${r.stage}</td>
    <td class="text">${r.dayFrom}-${r.dayTo}</td>
    <td>${fmt(r.kgPerDay,1)}</td>
  </tr>`).join('');

  const todayStr2 = new Date().toISOString().slice(0,10);
  const newArrivals = activeAnimals.map(p=>{
    const daysSince = p.animal.purchaseDate ? daysBetween(p.animal.purchaseDate, todayStr2) : null;
    return { p, daysSince };
  }).filter(x=> x.daysSince !== null && x.daysSince >= 0 && x.daysSince <= FEED_RAMPUP.durationDays);

  const rampupAnimalRows = newArrivals.map(({p,daysSince})=>{
    const row = lookupFeedRampup(daysSince);
    return `<tr>
      <td class="text"><span class="tag">${p.animal.tagNumber}</span></td>
      <td class="text">${p.animal.purchaseDate}</td>
      <td>${daysSince}</td>
      <td>${row? row.stage : '-'}</td>
      <td>${row? fmt(row.kgPerDay,1) : '-'}</td>
    </tr>`;
  }).join('');

  const targetWeight = parseFloat(state.config.targetWeightKg) || null;
  const needForecast = targetWeight ? computeFeedNeedToTarget(targetWeight) : null;
  const forecastRows = needForecast ? needForecast.results.map(r=>{
    if(r.w0===null) return `<tr>
      <td class="text"><span class="tag">${r.animal.tagNumber}</span></td>
      <td colspan="9" class="text">بيانات غير كافية (وزن الشراء غير صحيح)</td>
    </tr>`;
    if(r.reached) return `<tr>
      <td class="text"><span class="tag">${r.animal.tagNumber}</span></td>
      <td>${fmt(r.w0,1)}</td>
      <td class="text">${r.lastWeightDate || '-'}</td>
      <td colspan="7" class="text"><span class="badge excellent">وصل للوزن المستهدف بالفعل</span></td>
    </tr>`;
    if(r.unreachable) return `<tr>
      <td class="text"><span class="tag">${r.animal.tagNumber}</span></td>
      <td>${fmt(r.w0,1)}</td>
      <td class="text">${r.lastWeightDate || '-'}</td>
      <td colspan="7" class="text"><span class="badge warn">معدل الزيادة الحالي غير كافٍ للوصول للوزن ده</span></td>
    </tr>`;
    const arrivalDate = (()=>{ const base = r.lastWeightDate ? new Date(r.lastWeightDate) : new Date(); const d=new Date(base); d.setDate(d.getDate()+r.days); return d.toISOString().slice(0,10); })();
    return `<tr>
      <td class="text"><span class="tag">${r.animal.tagNumber}</span></td>
      <td>${fmt(r.w0,1)}</td>
      <td class="text">${r.lastWeightDate || '-'}</td>
      <td>${r.days}</td>
      <td class="text">${arrivalDate}</td>
      <td>${fmt(r.concKg,1)}</td>
      <td>${fmt(r.strawKg,1)}</td>
      <td>${fmt(r.hayKg,1)}</td>
      <td>${fmt(r.branKg,1)}</td>
      <td>${fmt(r.molassesKg,1)}</td>
    </tr>`;
  }).join('') : '';

  return `
  <div class="card">
    <h2>${FEEDING_PROGRAM.title} <span class="i18n-en">Total Mixed Ration</span></h2>
    <div class="table-scroll"><table class="fp-table">
      <tr><th>الوزن (كجم)</th><th>علف مركز</th><th>التبن</th><th>الدريس</th><th>النخالة</th><th>المولاس (جم)</th></tr>
      ${rows}
    </table></div>
    <div class="fp-unit">الكميات لكل رأس في اليوم — بالكيلو، ما عدا المولاس بالجرام</div>
  </div>
  <div class="card">
    <h2>خطة تدرج العلف عند دخول عجل جديد <span class="i18n-en">Feed Ramp-Up Plan</span> (أول ${FEED_RAMPUP.durationDays} يوم)</h2>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px">علف مركز لكل عجل/يوم — بغض النظر عن حجم القطيع، نفس الأرقام تتطبق على أي دفعة جديدة. بيزيد تدريجيًا كل يومين عشان الكرش يتعود عليه، لحد ما يوصل ${fmt(FEED_RAMPUP.rows[FEED_RAMPUP.rows.length-1].kgPerDay,1)} كجم/عجل في اليوم ${FEED_RAMPUP.durationDays}. بعد كده، انتقل لجدول "برنامج التغذية" الرئيسي فوق حسب الوزن.</div>
    <div class="table-scroll"><table>
      <tr><th>المرحلة</th><th>الأيام (من تاريخ الدخول)</th><th>علف مركز لكل عجل/يوم (كجم)</th></tr>
      ${rampupRows}
    </table></div>
    <h2 style="margin-top:18px">حيوانات لسه في فترة التدرج دلوقتي <span class="i18n-en">Animals Currently Ramping Up</span></h2>
    ${newArrivals.length===0? `<div class="empty">مفيش حيوانات نشطة في أول ${FEED_RAMPUP.durationDays} يوم من تاريخ الشراء حاليًا</div>` : `
    <div class="table-scroll"><table>
      <tr><th>رقم الحيوان</th><th>تاريخ الدخول</th><th>عدد الأيام منذ الدخول</th><th>المرحلة</th><th>علف مركز موصى به اليوم (كجم)</th></tr>
      ${rampupAnimalRows}
    </table></div>`}
  </div>
  <div class="card">
    <h2>مرحلة كل حيوان دلوقتي <span class="i18n-en">Current Stage per Animal</span> (حسب آخر وزن مسجل)</h2>
    ${activeAnimals.length===0? `<div class="empty">مفيش حيوانات نشطة حاليًا</div>` : `
    <div class="table-scroll"><table>
      <tr><th>رقم الحيوان</th><th>آخر وزن (كجم)</th><th>المرحلة الحالية</th><th>علف مركز</th><th>التبن</th><th>الدريس</th><th>النخالة</th><th>المولاس (جم)</th><th>ADG الفعلي (جم/يوم)</th></tr>
      ${animalRows}
    </table></div>`}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px">المرحلة والعليقة الموصى بها بيتحددوا تلقائيًا من أقرب وزن في جدول برنامج التغذية فوق. الأرقام دي مرجعية من الجدول المرفوع، مش بتتغير حسب بياناتك.</div>
  </div>
  <div class="card">
    <h2>توقع الاحتياج حتى وزن مستهدف <span class="i18n-en">Feed Need to Target Weight</span></h2>
    <div class="form-grid">
      <div><label>الوزن المستهدف (كجم)</label><input type="number" step="any" id="targetWeightInput" value="${targetWeight || ''}" placeholder="مثلاً: 450"></div>
    </div>
    ${!targetWeight? `<div class="empty">حدد الوزن المستهدف فوق عشان يظهر توقع العلف المطلوب لكل حيوان نشط من آخر وزن مسجل له لحد ما يوصل للوزن ده</div>` : (needForecast.totals.activeCount===0? `<div class="empty">مفيش حيوانات نشطة حاليًا</div>` : `
    <div class="stat-grid" style="margin-top:10px">
      <div class="stat"><div class="num">${fmt(needForecast.totals.totalConcKg,0)} كجم</div><div class="label">إجمالي العلف المركز المطلوب للقطيع كله لحد الوزن المستهدف</div></div>
      <div class="stat"><div class="num">${fmt(needForecast.totals.totalStrawKg,0)} كجم</div><div class="label">إجمالي التبن المطلوب</div></div>
      <div class="stat"><div class="num">${fmt(needForecast.totals.totalHayKg,0)} كجم</div><div class="label">إجمالي الدريس المطلوب</div></div>
      <div class="stat"><div class="num">${fmt(needForecast.totals.totalBranKg,0)} كجم</div><div class="label">إجمالي النخالة المطلوبة</div></div>
      <div class="stat"><div class="num">${fmt(needForecast.totals.totalMolassesKg,1)} كجم</div><div class="label">إجمالي المولاس المطلوب</div></div>
      <div class="stat"><div class="num">${needForecast.totals.maxDays!==null? needForecast.totals.maxDays : '-'}</div><div class="label">أطول مدة متوقعة لوصول حيوان للوزن المستهدف (يوم)</div></div>
    </div>
    <div class="table-scroll" style="margin-top:10px"><table>
      <tr><th>رقم الحيوان</th><th>آخر وزن مسجل</th><th>تاريخه</th><th>أيام متوقعة للوصول</th><th>تاريخ الوصول التقريبي</th><th>علف مركز (كجم)</th><th>التبن (كجم)</th><th>الدريس (كجم)</th><th>النخالة (كجم)</th><th>المولاس (كجم)</th></tr>
      ${forecastRows}
    </table></div>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:8px">الحساب بياخد آخر وزن مسجل لكل حيوان نشط، ومعدل الزيادة الفعلي له لو متسجل (أو المتوقع من جدول برنامج التغذية فوق لو لسه مفيش بيانات كفاية)، ويجمع احتياج العلف يوم بيوم لحد ما يوصل للوزن المستهدف — مع تحديث نوع العليقة تلقائيًا كل ما الوزن يزيد حسب الجدول. عدد الأيام وتاريخ الوصول محسوبين من تاريخ آخر وزن مسجل (مش من النهاردة) — يعني لو آخر وزنة قديمة، سجّل وزنة جديدة الأول عشان التوقع يكون دقيق. "المالئ" هو خلطة الخشن المرجعية من الجدول فوق (تبن/دريس/ردة/مولاس)، مش دريس خالص. ده تقدير تخطيطي بيفترض استمرار نفس معدل الزيادة ومفيش حيوانات جديدة هتتضاف أو هتتباع في الأثناء — مش رقم مضمون.</div>`)}
  </div>`;
}

function renderHealth(){
  const animalOptions = state.animals.filter(isActiveAnimal).map(a=>`<option value="${a.id}">${a.tagNumber} — ${a.type}</option>`).join('');
  const todayStr = new Date().toISOString().slice(0,10);
  const rows = state.healthRecords.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).map(h=>{
    const an = state.animals.find(a=>a.id===h.animalId);
    let dueCell = '-';
    if(h.nextDueDate){
      const days = daysBetween(todayStr, h.nextDueDate);
      if(days < 0) dueCell = `<span class="badge warn">${h.nextDueDate} (متأخر)</span>`;
      else if(days <= 7) dueCell = `<span class="badge warn">${h.nextDueDate} (قريبًا)</span>`;
      else dueCell = h.nextDueDate;
    }
    return `<tr>
      <td class="text"><span class="tag">${an? an.tagNumber : '؟'}</span></td>
      <td class="text">${h.type}</td>
      <td>${h.date}</td>
      <td class="text">${dueCell}</td>
      <td class="text">${h.note || '-'}</td>
      <td><button class="btn danger small" data-del-health="${h.id}">حذف</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <h2>تسجيل حالة صحية / تحصين <span class="i18n-en">Record Health Event / Vaccination</span></h2>
    ${state.animals.length===0? `<div class="empty">أضف حيوانات أولاً من شيت "الحيوانات" قبل تسجيل السجل الصحي</div>` : `
    <form id="healthForm">
      <div class="form-grid">
        <div><label>رقم الحيوان</label><select name="animalId" required>${animalOptions}</select></div>
        <div><label>النوع</label><select name="type">${HEALTH_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
        <div><label>التاريخ</label><input required type="date" name="date"></div>
        <div><label>موعد الجرعة/الفحص القادم (اختياري)</label><input type="date" name="nextDueDate"></div>
        <div><label>ملاحظات (اختياري)</label><input name="note" placeholder="تفاصيل إضافية"></div>
      </div>
      <button class="btn" type="submit">إضافة السجل</button>
    </form>`}
  </div>
  <div class="card">
    <h2>السجل الصحي <span class="i18n-en">Health Record</span> (${state.healthRecords.length})</h2>
    ${state.healthRecords.length===0? `<div class="empty"><div class="big">💉</div>لسه معندكش سجلات صحية أو تحصينات مسجلة</div>` : `
    <div class="table-scroll"><table>
      <tr><th>رقم الحيوان</th><th>النوع</th><th>التاريخ</th><th>الموعد القادم</th><th>ملاحظات</th><th></th></tr>
      ${rows}
    </table></div>`}
  </div>`;
}

function renderGuide(){
  const lastBackup = state.meta && state.meta.lastBackupAt;
  return `
  <div class="card">
    <h2>النسخ الاحتياطي <span class="i18n-en">Backup</span></h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px">
      كل البيانات محفوظة على هذا الجهاز/المتصفح بس. لو اتمسحت بيانات المتصفح أو اتغير الجهاز، هتضيع البيانات نهائيًا —
      اعمل نسخة احتياطية بانتظام (كل ما تضيف حيوانات أو أوزان كتير) وخزّنها في مكان تاني (إيميل، جوجل درايف، إلخ).
      ${lastBackup? `<br>آخر نسخة احتياطية: ${lastBackup.slice(0,10)}` : '<br>لسه معملتش أي نسخة احتياطية.'}
    </p>
    <button class="btn" id="exportBackupBtn" type="button">تصدير نسخة احتياطية (JSON)</button>
    <button class="btn secondary" id="importBackupBtn" type="button">استيراد نسخة احتياطية</button>
    <button class="btn secondary" id="pasteBackupBtn" type="button">لصق نسخة احتياطية</button>
    <input type="file" id="importFileInput" accept="application/json,.json" style="display:none">
  </div>
  <div class="card guide-text">
    <h2>دليل الاستخدام <span class="i18n-en">User Guide</span></h2>
    <p>هذا نظام لإدارة بيانات مزرعتك بالكامل، مبني على نفس منطق ملف الإكسل الأصلي — لكن بدون الحاجة لكتابة أي معادلة يدويًا.</p>
    <p><b>0) الجدوى المالية:</b> دراسة مالية مستقلة تمامًا عن بيانات حيواناتك الفعلية، ومبنية على معادلات: غيّر أي رقم في المدخلات (سعر الشراء، سعر البيع، نسبة العلف من وزن الجسم، عدد الأيام، الأسعار، الرواتب...) وكل الكميات والتكاليف والإيرادات وصافي الربح والعائد على الاستثمار (ROI) بتتغير لحظيًا. تقدر تضيف أي بند مصروف أو إيراد إضافي (اسم × كمية × سعر الوحدة) أو تعدّله أو تحذفه في أي وقت من غير ما تحتاج تكلمني.</p>
    <p><b>1) الحيوانات:</b> سجّل بيانات كل حيوان مرة واحدة عند الشراء. تقدر تعدّل أي بيانات لاحقًا من زرار "تعديل"، وحذف الحيوان بيمسح معاه أوزانه ومبيعاته وسجله الصحي.</p>
    <p><b>2) سجل الأوزان:</b> كل عملية وزن (أسبوعيًا مثلاً) تُضاف كسطر جديد — بدون حد أقصى، وتقدر تعدّل أي وزنة غلط منها مباشرة.</p>
    <p><b>3) تحليل الأداء:</b> يحسب تلقائيًا معدل الزيادة اليومي لكل حيوان، ويصنّف الأداء (ممتاز / جيد / ضعيف / تحذير)، ويقدّر "سعر التعادل" لكل حيوان (أقل سعر بيع تقريبًا عشان متخسرش)، ومقارنة حسب المورد والعنبر.</p>
    <p><b>4) السجل الصحي:</b> سجّل التحصينات والعلاجات والفحوصات لكل حيوان، مع إمكانية تسجيل موعد الجرعة/الفحص القادم — والنظام بينبهك لما يقرب أو يتأخر.</p>
    <p><b>5) المصاريف:</b> سجّل مصاريف العلف (بالكمية بالكجم كمان عشان يتحسب معدل تحويل العلف FCR)، وكل حاجة خاصة بالبيطري، والنظام بيجمعهم تلقائيًا.</p>
    <p><b>6) لوحة التحكم:</b> أهم الأرقام في صفحة واحدة، مع ملخص مالي، وكفاءة التغذية (FCR ومتوسط تكلفة الكيلو)، وعدد الحالات النافقة وخسائرها. وتحت جدول "جولات الوزن"، هتلاقي "الزيادة المتوقعة في الجولة الجاية" — بيتحسب تلقائيًا من تاريخ آخر جولة وزن مسجلة ومتوسط الفترة بين جولاتك (غالبًا حوالي 30 يوم)، ويديك الزيادة الكلية المتوقعة للقطيع النشط وتاريخ الجولة الجاية المتوقع. لو عايز فترة مختلفة عن المتوسط، اكتبها في الخانة وهيحدّث الحساب والتاريخ فورًا.</p>
    <p><b>7) المبيعات:</b> سجّل بيانات البيع — والحيوان يتحول تلقائيًا لحالة "مباع". وفيه حالة "نافق" لتسجيل نفوق أي حيوان بدل ما يختفي من غير حساب. الجدول بيوريك "هامش البيع" (سعر البيع − سعر الشراء بس) و"صافي الربح الحقيقي" (بعد خصم نصيب الحيوان التقديري من تكلفة العلف والرعاية الصحية، محسوب من متوسط كفاءة القطيع × الزيادة اللي حققها هو بالذات) — الرقمين مختلفين عمدًا عشان توضحلك إن البيع ممكن يكون شكله مربح على الورق بس فعليًا خسران لما تحسب تكلفة التربية.</p>
    <p><b>8) سعر السوق وتقرير الربحية (في تحليل الأداء):</b> سجّل سعر الكيلو الحي في السوق كل ما يتغير. النظام بيقارنه بمتوسط سعر التعادل تلقائيًا، وتحت في نفس الصفحة هتلاقي تقرير لكل حيوان نشط بالتكلفة الإجمالية والقيمة المتوقعة وهامش الربح، مع قرار "استمر في التسمين" أو "قرّب موعد البيع" حسب مقارنة تكلفة الكيلو الإضافي بسعر السوق. نفس السعر ده تقدر كمان تحدّثه بسرعة من "لوحة التحكم" في كارت "الملخص المالي" — في قسم "لو بعت القطيع النشط كله النهاردة؟"، اللي بيوريك صافي ربح أو خسارة كلي متوقع لو بعت كل القطيع النشط دلوقتي بالسعر ده (بيحسبه من الوزن الإجمالي الحالي للحيوانات النشطة مقابل كل المشتريات والمصاريف من أول ما بدأت).</p>
    <p><b>9) توقع الاحتياج حتى وزن مستهدف (في برنامج التغذية):</b> حدد الوزن اللي عايز تربي الحيوانات لحده، والنظام هياخد آخر وزن مسجل لكل حيوان نشط ومعدل زيادته (الفعلي لو متسجل، أو المتوقع من جدول برنامج التغذية لو لسه مفيش بيانات كفاية)، ويحسب يوم بيوم كام كيلو علف مركز وكام كيلو مالئ/خشن محتاج لحد ما يوصل للوزن ده — مع تحديث نوع العليقة تلقائيًا كل ما الوزن يزيد. بيديك كمان تاريخ تقريبي متوقع للوصول لكل حيوان. ده تقدير تخطيطي بيفترض استمرار نفس معدل الزيادة ومفيش حيوانات جديدة هتتضاف أو هتتباع في الأثناء — مش رقم مضمون.</p>
    <p><b>10) خطة تدرج العلف عند الدخول (في برنامج التغذية):</b> جدول مرجعي لأول 50 يوم من عمر أي عجل جديد في المزرعة — علف مركز لكل عجل/يوم بغض النظر عن حجم القطيع (بيبدأ 0.1 كجم ويزيد 0.1 كجم كل يومين لحد ما يوصل 2.5 كجم في اليوم الخمسين)، عشان كرش العجل يتعود على العلف المركز تدريجيًا من غير مشاكل هضمية. تحت الجدول هتلاقي أي حيوان نشط لسه في أول 50 يوم من تاريخ شرائه، مع المرحلة والكمية الموصى بها له اليوم تلقائيًا. بعد ما العجل يعدي الـ50 يوم، يتحول لجدول "برنامج التغذية" الرئيسي حسب وزنه.</p>
    <p><b>رسائل التنبيه:</b></p>
    <p>• <b>بيانات غير كافية</b>: الحيوان لسه ملوش أي وزنة مسجلة.<br>
    • <b>خطأ بالتواريخ</b>: تاريخ آخر وزن هو نفسه تاريخ الشراء أو قبله.<br>
    • <b>وزن الشراء غير صحيح</b>: وزن الشراء فارغ أو صفر.<br>
    • <b>تكرار بيانات</b>: فيه أكتر من وزنة في نفس التاريخ لنفس الحيوان.</p>
    <p>كل البيانات بتتحفظ تلقائيًا على جهازك، ومش هتضيع لو قفلت الصفحة — لكن ده مش بديل عن نسخة احتياطية (شوف فوق).</p>
    <button class="reset-link" id="resetAllBtn">مسح كل البيانات والبدء من جديد</button>
  </div>`;
}

function attachHandlers(){
  attachScaleHandlers();
  document.querySelectorAll('[data-view-animal]').forEach(b=>{
    b.addEventListener('click', e=>{
      if(e.target.closest('[data-edit-animal],[data-del-animal]') && !b.matches('[data-edit-animal],[data-del-animal]')) return;
      selectedAnimalId = b.dataset.viewAnimal;
      activeTab = 'animals';
      render();
      if(window.innerWidth <= 1180) window.scrollTo({top:0});
    });
  });
  document.querySelectorAll('[data-close-file]').forEach(b=>{
    b.addEventListener('click', ()=>{ selectedAnimalId = null; render(); });
  });
  document.querySelectorAll('[data-afilter]').forEach(sel=>{
    sel.addEventListener('change', ()=>{ animalFilter[sel.dataset.afilter] = sel.value; render(); });
  });
  document.querySelectorAll('.feas-param').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      if(!state.feasibility.params) state.feasibility.params = {};
      const v = parseFloat(inp.value);
      state.feasibility.params[inp.dataset.feasParam] = isNaN(v) ? 0 : v;
      await persist('feasibility');
      render();
    });
  });

  document.querySelectorAll('.feas-custom').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const listKey = inp.dataset.feasList;
      const item = (state.feasibility[listKey]||[]).find(x=>x.id===inp.dataset.feasId);
      if(item){
        item[inp.dataset.feasField] = inp.value;
        await persist('feasibility');
        render();
      }
    });
  });

  document.querySelectorAll('[data-del-feas-list]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const listKey = b.dataset.delFeasList;
      state.feasibility[listKey] = (state.feasibility[listKey]||[]).filter(x=>x.id!==b.dataset.delFeasId);
      await persist('feasibility');
      render();
    });
  });

  [['addCustomExpenseForm','customExpenseItems','تمت إضافة بند المصروف'],['addCustomRevenueForm','customRevenueItems','تمت إضافة بند الإيراد']].forEach(([formId,listKey,msg])=>{
    const form = document.getElementById(formId);
    if(!form) return;
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const f = new FormData(form);
      if(!Array.isArray(state.feasibility[listKey])) state.feasibility[listKey] = [];
      state.feasibility[listKey].push({ id: uid(), name: f.get('name').trim(), qty: f.get('qty'), unitPrice: f.get('unitPrice') });
      await persist('feasibility');
      showToast(msg);
      render();
    });
  });

  const animalForm = document.getElementById('animalForm');
  if(animalForm){
    animalForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const f = new FormData(animalForm);
      const tagNumber = f.get('tagNumber').trim();
      if(state.animals.some(a=>a.tagNumber === tagNumber)){
        showToast('رقم الحيوان ده مسجل بالفعل — استخدم رقم مختلف');
        return;
      }
      const animal = {
        id: uid(),
        tagNumber: tagNumber,
        type: f.get('type'),
        purchaseDate: f.get('purchaseDate'),
        supplier: f.get('supplier').trim(),
        purchasePrice: f.get('purchasePrice'),
        purchaseWeight: f.get('purchaseWeight'),
        pen: f.get('pen').trim(),
        status: f.get('status'),
      };
      state.animals.push(animal);
      await persist('animals');
      showToast('تمت إضافة الحيوان');
      render();
    });
  }

  document.querySelectorAll('[data-del-animal]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.delAnimal;
      const relatedWeights = state.weights.filter(w=>w.animalId===id).length;
      const relatedSales = state.sales.filter(s=>s.animalId===id).length;
      const relatedHealth = state.healthRecords.filter(h=>h.animalId===id).length;
      let msg = 'حذف هذا الحيوان نهائيًا؟';
      const parts = [];
      if(relatedWeights) parts.push(`${relatedWeights} وزنة`);
      if(relatedSales) parts.push(`${relatedSales} عملية بيع`);
      if(relatedHealth) parts.push(`${relatedHealth} سجل صحي`);
      if(parts.length) msg += ` هيتحذف معاه كمان: ${parts.join('، ')}.`;
      if(!(await appConfirm(msg, 'حذف'))) return;
      state.animals = state.animals.filter(a=>a.id!==id);
      state.weights = state.weights.filter(w=>w.animalId!==id);
      state.sales = state.sales.filter(s=>s.animalId!==id);
      state.healthRecords = state.healthRecords.filter(h=>h.animalId!==id);
      await Promise.all([persist('animals'), persist('weights'), persist('sales'), persist('healthRecords')]);
      showToast('تم حذف الحيوان وكل بياناته المرتبطة');
      render();
    });
  });

  document.querySelectorAll('[data-edit-animal]').forEach(b=>{
    b.addEventListener('click', ()=>{
      editingAnimalId = b.dataset.editAnimal;
      render();
    });
  });

  document.querySelectorAll('[data-cancel-animal]').forEach(b=>{
    b.addEventListener('click', ()=>{
      editingAnimalId = null;
      render();
    });
  });

  document.querySelectorAll('.edit-animal-status').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const wrap = sel.parentElement.querySelector('.death-fields');
      if(wrap) wrap.style.display = sel.value === 'نافق' ? 'flex' : 'none';
    });
  });

  document.querySelectorAll('[data-save-animal]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.saveAnimal;
      const tr = b.closest('tr');
      const tagNumber = tr.querySelector('.edit-animal-tag').value.trim();
      const type = tr.querySelector('.edit-animal-type').value;
      const purchaseDate = tr.querySelector('.edit-animal-purchaseDate').value;
      const supplier = tr.querySelector('.edit-animal-supplier').value.trim();
      const purchasePrice = tr.querySelector('.edit-animal-purchasePrice').value;
      const purchaseWeight = tr.querySelector('.edit-animal-purchaseWeight').value;
      const pen = tr.querySelector('.edit-animal-pen').value.trim();
      const status = tr.querySelector('.edit-animal-status').value;
      const deathDateEl = tr.querySelector('.edit-animal-deathDate');
      const deathCauseEl = tr.querySelector('.edit-animal-deathCause');
      if(!tagNumber || !purchaseDate || !purchasePrice || !purchaseWeight){
        showToast('من فضلك أكمل الحقول المطلوبة');
        return;
      }
      if(state.animals.some(a=>a.tagNumber === tagNumber && a.id !== id)){
        showToast('رقم الحيوان ده مستخدم بالفعل لحيوان تاني');
        return;
      }
      if(status === 'نافق' && !(deathDateEl && deathDateEl.value)){
        showToast('من فضلك حدد تاريخ النفوق');
        return;
      }
      const an = state.animals.find(a=>a.id===id);
      if(an){
        an.tagNumber = tagNumber;
        an.type = type;
        an.purchaseDate = purchaseDate;
        an.supplier = supplier;
        an.purchasePrice = purchasePrice;
        an.purchaseWeight = purchaseWeight;
        an.pen = pen;
        an.status = status;
        an.deathDate = (status === 'نافق' && deathDateEl) ? deathDateEl.value : '';
        an.deathCause = (status === 'نافق' && deathCauseEl) ? deathCauseEl.value.trim() : '';
      }
      await persist('animals');
      editingAnimalId = null;
      showToast('تم تحديث بيانات الحيوان');
      render();
    });
  });

  const weightForm = document.getElementById('weightForm');
  if(weightForm){
    weightForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const f = new FormData(weightForm);
      state.weights.push({ id: uid(), animalId: f.get('animalId'), date: f.get('date'), weight: f.get('weight') });
      await persist('weights');
      showToast('تمت إضافة الوزنة');
      render();
    });
  }

  document.querySelectorAll('[data-del-weight]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.delWeight;
      state.weights = state.weights.filter(w=>w.id!==id);
      await persist('weights');
      render();
    });
  });

  document.querySelectorAll('.weight-date-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const animalId = sel.dataset.animalId;
      selectedWeightByAnimal[animalId] = sel.value;
      render();
    });
  });

  document.querySelectorAll('[data-edit-weight]').forEach(b=>{
    b.addEventListener('click', ()=>{
      editingWeightId = b.dataset.editWeight;
      render();
    });
  });

  document.querySelectorAll('[data-cancel-weight]').forEach(b=>{
    b.addEventListener('click', ()=>{
      editingWeightId = null;
      render();
    });
  });

  document.querySelectorAll('[data-save-weight]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.saveWeight;
      const tr = b.closest('tr');
      const animalId = tr.querySelector('.edit-weight-animal').value;
      const date = tr.querySelector('.edit-weight-date').value;
      const weight = tr.querySelector('.edit-weight-value').value;
      if(!date || !weight){
        showToast('من فضلك أدخل التاريخ والوزن');
        return;
      }
      const w = state.weights.find(x=>x.id===id);
      if(w){
        w.animalId = animalId;
        w.date = date;
        w.weight = weight;
      }
      await persist('weights');
      editingWeightId = null;
      showToast('تم تحديث الوزنة');
      render();
    });
  });

  const thresholdInput = document.getElementById('thresholdInput');
  if(thresholdInput){
    thresholdInput.addEventListener('change', async ()=>{
      const v = parseFloat(thresholdInput.value);
      if(!isNaN(v) && v > 0){
        state.config.threshold = v;
        await persist('config');
        render();
      }
    });
  }

  const totalEntryWeightInput = document.getElementById('totalEntryWeightInput');
  if(totalEntryWeightInput){
    totalEntryWeightInput.addEventListener('change', async ()=>{
      const v = parseFloat(totalEntryWeightInput.value);
      state.config.totalEntryWeight = (!isNaN(v) && v > 0) ? v : null;
      await persist('config');
      render();
    });
  }

  const totalEntryWeightDateInput = document.getElementById('totalEntryWeightDateInput');
  if(totalEntryWeightDateInput){
    totalEntryWeightDateInput.addEventListener('change', async ()=>{
      state.config.totalEntryWeightDate = totalEntryWeightDateInput.value || null;
      await persist('config');
      render();
    });
  }

  const totalCurrentWeightInput = document.getElementById('totalCurrentWeightInput');
  if(totalCurrentWeightInput){
    totalCurrentWeightInput.addEventListener('change', async ()=>{
      const v = parseFloat(totalCurrentWeightInput.value);
      state.config.totalCurrentWeight = (!isNaN(v) && v > 0) ? v : null;
      await persist('config');
      render();
    });
  }

  document.querySelectorAll('[data-edit-animal-modal]').forEach(b=>{
    b.addEventListener('click', ev=>{ ev.stopPropagation(); ev.preventDefault(); openAnimalEditModal(b.dataset.editAnimalModal); });
  });
  document.querySelectorAll('[data-edit-round]').forEach(b=>{
    b.addEventListener('click', ev=>{ ev.stopPropagation(); const d = b.dataset.editRound; if(d==='__start') openStartRoundModal(); else openRoundEditModal(d); });
  });
  document.querySelectorAll('.period-feed-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const date = inp.dataset.roundDate;
      if(!date) return;
      if(!state.config.periodFeedOverrides) state.config.periodFeedOverrides = {};
      const v = parseFloat(inp.value);
      if(!isNaN(v) && v > 0){
        state.config.periodFeedOverrides[date] = v;
      } else {
        delete state.config.periodFeedOverrides[date];
      }
      await persist('config');
      render();
    });
  });

  const expenseCategorySelect = document.getElementById('expenseCategory');
  if(expenseCategorySelect){
    expenseCategorySelect.addEventListener('change', ()=>{
      const cat = expenseCategorySelect.value;
      const qtyWrap = document.getElementById('expenseQtyWrap');
      if(qtyWrap) qtyWrap.style.display = (cat === "علف") ? '' : 'none';
      const qtyWrap2 = document.getElementById('expenseQtyWrap2');
      if(qtyWrap2) qtyWrap2.style.display = (cat === "علف") ? '' : 'none';
      const subSel = document.getElementById('expenseSubtype');
      if(subSel) subSel.innerHTML = subtypeOptionsHtml(cat, '');
      const subCustom = document.getElementById('expenseSubtypeCustom');
      if(subCustom){ subCustom.value = ''; subCustom.style.display = 'none'; }
      const req = document.getElementById('expenseSubtypeReq');
      if(req) req.style.display = (cat === "علف") ? '' : 'none';

  function updateExpenseFcrHint(){
    const hint = document.getElementById('expenseFcrHint');
    if(!hint) return;
    const val = readSubtype(document.getElementById('expenseSubtype'), document.getElementById('expenseSubtypeCustom')).trim();
    if(val === "علف مركز"){
      hint.textContent = '✅ الكمية المستهلكة هنا هتتحسب ضمن FCR';
      hint.style.color = 'var(--ok, #2e7d32)';
    } else if(val){
      hint.textContent = `⚠️ "${val}" مش بيتحسب في FCR — بيتحسب بس من الكمية المستهلكة من "علف مركز"`;
      hint.style.color = 'var(--warn, #b45309)';
    } else {
      hint.textContent = '';
      hint.style.color = 'var(--ink-soft)';
    }

  const expenseSubtypeInput = document.getElementById('expenseSubtype');
  if(expenseSubtypeInput){
    expenseSubtypeInput.addEventListener('change', ()=>{

      render();

  const bulkResolveFeedBtn = document.getElementById('bulkResolveFeedBtn');
  if(bulkResolveFeedBtn){
    bulkResolveFeedBtn.addEventListener('click', async ()=>{
      const n = bulkResolveConsumedFeed();
      await persist('expenses');
      showToast(`تم اعتبار ${n} مصروف مستهلك بالكامل`);
      render();
    });
  }

  document.querySelectorAll('[data-edit-expense]').forEach(b=>{
    b.addEventListener('click', ()=>{
      editingExpenseId = b.dataset.editExpense;
      render();
    });
  });

  document.querySelectorAll('[data-cancel-expense]').forEach(b=>{
    b.addEventListener('click', ()=>{
      editingExpenseId = null;
      render();
    });
  });

  document.querySelectorAll('[data-save-expense]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.saveExpense;
      const tr = b.closest('tr');
      const subType = readSubtype(tr.querySelector('.edit-expense-subtype-sel'), tr.querySelector('.edit-expense-subtype-custom'));
      const consumedKg = tr.querySelector('.edit-expense-consumed').value;
      const description = tr.querySelector('.edit-expense-description').value;
      const amount = tr.querySelector('.edit-expense-amount').value;
      const date = tr.querySelector('.edit-expense-date').value;
      if(!amount || !date){
        showToast('من فضلك أدخل المبلغ والتاريخ');
        return;
      }
      const e = state.expenses.find(x=>x.id===id);
      if(e){
        e.subType = subType;
        e.consumedKg = consumedKg;
        e.description = description;
        e.amount = amount;
        e.date = date;
        e.updatedAt = new Date().toISOString().slice(0,10);
        delete e.quantityKg; // اتحول لنظام مخزون/مستهلك المنفصل دلوقتي، معدش محتاجين الحقل القديم
      }
      await persist('expenses');
      editingExpenseId = null;
      showToast('تم تحديث المصروف');
      render();
    });
  });

  const staleWeightThresholdInput = document.getElementById('staleWeightThresholdInput');
  if(staleWeightThresholdInput){
    staleWeightThresholdInput.addEventListener('change', async ()=>{
      const v = parseInt(staleWeightThresholdInput.value);
      state.config.staleWeightDaysThreshold = (!isNaN(v) && v > 0) ? v : null;
      await persist('config');
      render();
    });
  }

  const rampupWarnThresholdInput = document.getElementById('rampupWarnThresholdInput');
  if(rampupWarnThresholdInput){
    rampupWarnThresholdInput.addEventListener('change', async ()=>{
      const v = parseInt(rampupWarnThresholdInput.value);
      state.config.rampupEndingWarnDays = (!isNaN(v) && v > 0) ? v : null;
      await persist('config');
      render();
    });
  }

  const nearTargetThresholdInput = document.getElementById('nearTargetThresholdInput');
  if(nearTargetThresholdInput){
    nearTargetThresholdInput.addEventListener('change', async ()=>{
      const v = parseInt(nearTargetThresholdInput.value);
      state.config.nearTargetWarnDays = (!isNaN(v) && v > 0) ? v : null;
      await persist('config');
      render();
    });
  }

  const nextRoundDaysInput = document.getElementById('nextRoundDaysInput');
  if(nextRoundDaysInput){
    nextRoundDaysInput.addEventListener('change', async ()=>{
      const v = parseFloat(nextRoundDaysInput.value);
      state.config.nextRoundDaysOverride = (!isNaN(v) && v > 0) ? v : null;
      await persist('config');
      render();
    });
  }

  const targetWeightInput = document.getElementById('targetWeightInput');
  if(targetWeightInput){
    targetWeightInput.addEventListener('change', async ()=>{
      const v = parseFloat(targetWeightInput.value);
      state.config.targetWeightKg = (!isNaN(v) && v > 0) ? v : null;
      await persist('config');
      render();
    });
  }

  const marketPriceForm = document.getElementById('marketPriceForm');
  if(marketPriceForm){
    marketPriceForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const f = new FormData(marketPriceForm);
      state.marketPrices.push({
        id: uid(),
        date: f.get('date'),
        pricePerKg: f.get('pricePerKg'),
      });
      await persist('marketPrices');
      showToast('تم تسجيل سعر السوق');
      render();
    });
  }

  const marketPriceFormDashboard = document.getElementById('marketPriceFormDashboard');
  if(marketPriceFormDashboard){
    marketPriceFormDashboard.addEventListener('submit', async e=>{
      e.preventDefault();
      const f = new FormData(marketPriceFormDashboard);
      state.marketPrices.push({
        id: uid(),
        date: f.get('date'),
        pricePerKg: f.get('pricePerKg'),
      });
      await persist('marketPrices');
      showToast('تم تحديث سعر اليوم');
      render();
    });
  }

  document.querySelectorAll('[data-del-marketprice]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.delMarketprice;
      state.marketPrices = state.marketPrices.filter(m=>m.id!==id);
      await persist('marketPrices');
      render();
    });
  });

  const healthForm = document.getElementById('healthForm');
  if(healthForm){
    healthForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const f = new FormData(healthForm);
      state.healthRecords.push({
        id: uid(),
        animalId: f.get('animalId'),
        type: f.get('type'),
        date: f.get('date'),
        nextDueDate: f.get('nextDueDate') || '',
        note: f.get('note').trim(),
      });
      await persist('healthRecords');
      showToast('تمت إضافة السجل الصحي');
      render();
    });
  }

  document.querySelectorAll('[data-del-health]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.delHealth;
      state.healthRecords = state.healthRecords.filter(h=>h.id!==id);
      await persist('healthRecords');
      render();
    });
  });

  const saleForm = document.getElementById('saleForm');
  if(saleForm){
    saleForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const f = new FormData(saleForm);
      const animalId = f.get('animalId');
      state.sales.push({ id: uid(), animalId, saleDate: f.get('saleDate'), salePrice: f.get('salePrice') });
      const an = state.animals.find(a=>a.id===animalId);
      if(an) an.status = "مباع";
      await Promise.all([persist('sales'), persist('animals')]);
      showToast('تم تسجيل البيع وتحديث حالة الحيوان');
      render();
    });
  }

  document.querySelectorAll('[data-del-sale]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.delSale;
      state.sales = state.sales.filter(s=>s.id!==id);
      await persist('sales');
      render();
    });
  });

  const resetBtn = document.getElementById('resetAllBtn');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      if(!(await appConfirm('هل أنت متأكد؟ سيتم حذف كل البيانات نهائيًا. لو محتاج ترجعها بعدين، صدّر نسخة احتياطية الأول.', 'مسح كل البيانات'))) return;
      state = { animals:[], weights:[], sales:[], expenses:[], healthRecords:[], marketPrices:[], measurements:[], feasibility:seedFeasibilityDefaults(), config:{threshold:0.6}, meta:{lastBackupAt:null} };
      await Promise.all([persist('animals'), persist('weights'), persist('sales'), persist('expenses'), persist('healthRecords'), persist('marketPrices'), persist('measurements'), persist('feasibility'), persist('config'), persist('meta')]);
      showToast('تم مسح كل البيانات');
      render();
    });
  }

  const exportBackupBtn = document.getElementById('exportBackupBtn');
  if(exportBackupBtn){
    exportBackupBtn.addEventListener('click', exportBackup);
  }

  const quickBackupBtn = document.getElementById('quickBackupBtn');
  if(quickBackupBtn){
    quickBackupBtn.addEventListener('click', exportBackup);
  }

  const pasteBackupBtn = document.getElementById('pasteBackupBtn');
  if(pasteBackupBtn) pasteBackupBtn.addEventListener('click', openBackupPasteModal);
  const importBackupBtn = document.getElementById('importBackupBtn');
  const importFileInput = document.getElementById('importFileInput');
  if(importBackupBtn && importFileInput){
    importBackupBtn.addEventListener('click', ()=> importFileInput.click());
    importFileInput.addEventListener('change', ()=>{
      const file = importFileInput.files && importFileInput.files[0];
      if(file) importBackup(file);
      importFileInput.value = '';
    });
  }
}

// ---------- Backup / restore ----------
function buildBackupPayload(){
  return {
    exportedAt: new Date().toISOString(),
    version: 1,
    data: {
      animals: state.animals,
      weights: state.weights,
      sales: state.sales,
      expenses: state.expenses,
      healthRecords: state.healthRecords,
      marketPrices: state.marketPrices,
      measurements: state.measurements || [],
      feasibility: state.feasibility,
      config: state.config,
    }
  };
}

async function exportBackup(){
  const payload = buildBackupPayload();
  const json = JSON.stringify(payload, null, 2);
  if(IN_FRAME || window.__forceFrame){ openBackupCopyModal(json); return; }
  try{
    const blob = new Blob([json], {type:'application/json'});
    const stamp = new Date().toISOString().slice(0,10);
    const fname = `نسخة-احتياطية-مزرعتي-${stamp}.json`;
    try{
      const file = new File([blob], fname, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
        await navigator.share({files:[file], title: fname});
        return;
      }
    }catch(err){ if(err && err.name === 'AbortError') return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    console.error(e);
    showToast('تعذر تنزيل الملف على هذا المتصفح');
    return;
  }
  state.meta.lastBackupAt = new Date().toISOString();
  await persist('meta');
  showToast('تم تنزيل النسخة الاحتياطية');
  render();
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e)=> importBackupText(e.target.result);
  reader.readAsText(file);
}
async function importBackupText(text){
    try{
      const parsed = JSON.parse(text);
      const data = (parsed && parsed.data && typeof parsed.data === 'object') ? parsed.data : parsed;
      if(!data || typeof data !== 'object') throw new Error('invalid file');
      if(!(await appConfirm('استيراد هذا الملف هيستبدل كل البيانات الحالية بالكامل. متأكد؟', 'استيراد'))) return;
      state.animals = Array.isArray(data.animals) ? data.animals : [];
      state.weights = Array.isArray(data.weights) ? data.weights : [];
      state.sales = Array.isArray(data.sales) ? data.sales : [];
      state.expenses = Array.isArray(data.expenses) ? data.expenses : [];
      state.healthRecords = Array.isArray(data.healthRecords) ? data.healthRecords : [];
      state.marketPrices = Array.isArray(data.marketPrices) ? data.marketPrices : [];
      state.measurements = Array.isArray(data.measurements) ? data.measurements : [];
      state.feasibility = (data.feasibility && data.feasibility.params) ? data.feasibility : seedFeasibilityDefaults();
      state.config = (data.config && typeof data.config === 'object') ? data.config : state.config;
      await Promise.all([persist('animals'), persist('weights'), persist('sales'), persist('expenses'), persist('healthRecords'), persist('marketPrices'), persist('measurements'), persist('feasibility'), persist('config')]);
      showToast('تم استيراد النسخة الاحتياطية بنجاح');
      render();
    }catch(err){
      console.error(err);
      showToast('تعذر قراءة الملف. تأكد إنه ملف نسخة احتياطية صحيح.');
    }
}

loadAll();
